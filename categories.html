<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Categories — GameHub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0F">
<link rel="stylesheet" href="css/style.css">
<style>
  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; }
  .cat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 14px; text-align:center; }
  .cat-tile .emoji{ font-size:28px; margin-bottom:8px; }
  .cat-tile .name{ font-weight:700; font-size:13px; }
  .cat-tile .count{ font-size:11px; color:var(--muted); margin-top:2px; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<header class="topbar"><div class="logo display">Categories</div></header>
<main class="container">
  <div class="cat-grid" id="catGrid"></div>
</main>
<nav class="bottom-nav" id="bottom-nav"></nav>
<script src="js/catalog-data.js"></script>
<script src="js/app.js"></script>
<script>
  renderBottomNav("games");
  const grid = document.getElementById('catGrid');
  grid.innerHTML = GAMEHUB_CATEGORIES.filter(c=>c.id!=='all').map(c => {
    const count = GAMEHUB_CATALOG.filter(g=>g.category===c.id).length;
    return `<a class="cat-tile" href="games.html?cat=${c.id}">
      <div class="emoji">${c.label.split(' ')[0]}</div>
      <div class="name">${c.label.split(' ').slice(1).join(' ')}</div>
      <div class="count">${count} game${count!==1?'s':''}</div>
    </a>`;
  }).join('');
</script>
</body>
</html>
