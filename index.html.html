<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>सुवर्ण गुहा — 3D कॉइन रन</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0; height:100%; overflow:hidden; background:#050608; font-family:'Inter',sans-serif;}
#canvas-wrap{ position:fixed; inset:0;}
canvas{ display:block; }

.hud{ position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:16px; pointer-events:none; z-index:10;}
.hud-pill{ background:rgba(18,20,28,0.75); backdrop-filter:blur(6px); border:1px solid rgba(201,163,78,0.3); border-radius:999px; padding:9px 16px; display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-weight:700; color:#e2bc6b; font-size:14px;}
.coin-icon{ width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e2bc6b, #c9a34e 65%); box-shadow:0 0 8px rgba(201,163,78,0.6);}
.title-pill{ background:rgba(18,20,28,0.75); backdrop-filter:blur(6px); border:1px solid rgba(201,163,78,0.3); border-radius:999px; padding:9px 16px; font-family:'Fraunces',serif; font-weight:600; color:#ede6d6; font-size:13px;}

.joystick-zone{ position:fixed; bottom:26px; left:26px; width:120px; height:120px; z-index:10; touch-action:none;}
.joystick-base{ width:100%; height:100%; border-radius:50%; background:rgba(32,36,47,0.55); border:1px solid rgba(201,163,78,0.3); position:relative;}
.joystick-thumb{ width:52px; height:52px; border-radius:50%; background:rgba(201,163,78,0.85); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); box-shadow:0 0 14px rgba(201,163,78,0.5); transition:transform .05s linear;}

.hint{ position:fixed; bottom:30px; right:26px; z-index:10; color:#b8b2a4; font-size:11px; text-align:right; line-height:1.6; max-width:150px; pointer-events:none;}
.hint b{ color:#e2bc6b;}

.overlay{ position:fixed; inset:0; background:rgba(5,6,8,0.92); display:none; align-items:center; justify-content:center; z-index:50; flex-direction:column; text-align:center; padding:30px;}
.overlay.show{ display:flex;}
.overlay h1{ font-family:'Fraunces',serif; font-size:32px; color:#e2bc6b; margin:0 0 10px;}
.overlay p{ color:#b8b2a4; font-size:14px; max-width:320px; line-height:1.6; margin-bottom:22px;}
.overlay button{ background:#c9a34e; color:#12141c; border:none; border-radius:10px; padding:14px 28px; font-weight:700; font-size:14px; cursor:pointer;}
.overlay button:active{ transform:scale(0.97);}
.overlay .stat{ font-family:'JetBrains Mono',monospace; color:#4ecca3; font-size:22px; font-weight:700; margin-bottom:6px;}
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div class="hud">
  <div class="title-pill">🕯️ सुवर्ण गुहा</div>
  <div class="hud-pill"><span class="coin-icon"></span><span id="coinCount">0</span> / <span id="coinTotal">12</span></div>
</div>

<div class="joystick-zone" id="joystickZone">
  <div class="joystick-base"><div class="joystick-thumb" id="joystickThumb"></div></div>
</div>
<div class="hint">डेस्कटॉपवर <b>बाण-कळा</b> वापर<br>मोबाईलवर <b>जॉयस्टिक</b> ओढ<br>सर्व सोन्याची नाणी गोळा कर</div>

<div class="overlay show" id="startOverlay">
  <h1>सुवर्ण गुहा</h1>
  <p>अंधाऱ्या गुहेत उतर आणि विखुरलेली सगळी सोन्याची नाणी गोळा कर. सांभाळून — कडेला जाऊ नकोस!</p>
  <button id="startBtn">सुरू कर</button>
</div>

<div class="overlay" id="winOverlay">
  <h1>🎉 गुहा जिंकलीस!</h1>
  <div class="stat" id="finalTime">00:00</div>
  <p>सर्व 12 नाणी गोळा केलीस.</p>
  <button id="restartBtn">पुन्हा खेळ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ---------- SCENE SETUP ----------
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050608, 0.045);
  scene.background = new THREE.Color(0x050608);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  wrap.appendChild(renderer.domElement);

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- LIGHTING (cave / torch mood) ----------
  const ambient = new THREE.AmbientLight(0x1a1e2a, 1.2);
  scene.add(ambient);
  const torch = new THREE.PointLight(0xe2bc6b, 2.2, 22, 2);
  torch.position.set(0,4,0);
  torch.castShadow = true;
  scene.add(torch);
  const rim = new THREE.PointLight(0x4ecca3, 0.6, 30);
  rim.position.set(-10,6,-10);
  scene.add(rim);

  // ---------- CAVE FLOOR ----------
  const floorGeo = new THREE.PlaneGeometry(60,60,20,20);
  const floorMat = new THREE.MeshStandardMaterial({ color:0x1c1a22, roughness:0.95, metalness:0.05 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // cave wall boundary (visual)
  const wallGeo = new THREE.CylinderGeometry(26,26,10,24,1,true);
  const wallMat = new THREE.MeshStandardMaterial({ color:0x14121a, roughness:1, side:THREE.BackSide });
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.y = 4;
  scene.add(wall);

  // scattered rocks for atmosphere
  const rockMat = new THREE.MeshStandardMaterial({ color:0x2a2620, roughness:1 });
  for(let i=0;i<18;i++){
    const s = 0.5 + Math.random()*1.4;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s,0), rockMat);
    const ang = Math.random()*Math.PI*2, rad = 8+Math.random()*15;
    rock.position.set(Math.cos(ang)*rad, s*0.4, Math.sin(ang)*rad);
    rock.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    rock.castShadow = true; rock.receiveShadow = true;
    scene.add(rock);
  }

  // ---------- PLAYER ----------
  const player = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color:0xc9a34e, roughness:0.4, metalness:0.6, emissive:0x3a2f14, emissiveIntensity:0.4 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5,0.9,4,8), bodyMat);
  body.position.y = 0.95;
  body.castShadow = true;
  player.add(body);
  const glow = new THREE.PointLight(0xe2bc6b, 1.2, 6);
  glow.position.y = 1.2;
  player.add(glow);
  scene.add(player);

  // ---------- COINS ----------
  const coins = [];
  const coinGeo = new THREE.CylinderGeometry(0.45,0.45,0.12,20);
  const coinMat = new THREE.MeshStandardMaterial({ color:0xe2bc6b, metalness:0.85, roughness:0.25, emissive:0x8a6a24, emissiveIntensity:0.5 });
  const TOTAL_COINS = 12;
  for(let i=0;i<TOTAL_COINS;i++){
    const coin = new THREE.Mesh(coinGeo, coinMat);
    const ang = (i/TOTAL_COINS)*Math.PI*2 + Math.random()*0.4;
    const rad = 6 + Math.random()*13;
    coin.position.set(Math.cos(ang)*rad, 0.7, Math.sin(ang)*rad);
    coin.rotation.x = Math.PI/2;
    coin.castShadow = true;
    scene.add(coin);
    coins.push(coin);
  }
  document.getElementById('coinTotal').textContent = TOTAL_COINS;

  // ---------- CONTROLS ----------
  const keys = {};
  window.addEventListener('keydown', e=> keys[e.key]=true);
  window.addEventListener('keyup', e=> keys[e.key]=false);

  let joyVec = {x:0, y:0};
  const zone = document.getElementById('joystickZone');
  const thumb = document.getElementById('joystickThumb');
  let joyActive = false, joyStart = {x:0,y:0};
  function joyPos(e){ return e.touches ? e.touches[0] : e; }
  zone.addEventListener('touchstart', (e)=>{ joyActive=true; const p=joyPos(e); joyStart={x:p.clientX,y:p.clientY}; }, {passive:true});
  zone.addEventListener('touchmove', (e)=>{
    if(!joyActive) return;
    const p = joyPos(e);
    let dx = p.clientX-joyStart.x, dy = p.clientY-joyStart.y;
    const max = 40;
    const dist = Math.min(Math.hypot(dx,dy), max);
    const ang = Math.atan2(dy,dx);
    dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
    thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joyVec.x = dx/max; joyVec.y = dy/max;
  }, {passive:true});
  function joyEnd(){ joyActive=false; joyVec={x:0,y:0}; thumb.style.transform='translate(-50%,-50%)'; }
  zone.addEventListener('touchend', joyEnd);
  zone.addEventListener('touchcancel', joyEnd);

  // ---------- GAME STATE ----------
  let running = false;
  let collected = 0;
  let startTime = 0;
  let playerAngle = 0;
  const speed = 6.5;

  document.getElementById('startBtn').addEventListener('click', ()=>{
    document.getElementById('startOverlay').classList.remove('show');
    running = true; startTime = performance.now();
  });
  document.getElementById('restartBtn').addEventListener('click', ()=> location.reload());

  function updatePlayer(dt){
    let mx = joyVec.x, my = joyVec.y;
    if(keys['ArrowLeft']||keys['a']) mx = -1;
    if(keys['ArrowRight']||keys['d']) mx = 1;
    if(keys['ArrowUp']||keys['w']) my = -1;
    if(keys['ArrowDown']||keys['s']) my = 1;

    const len = Math.hypot(mx,my);
    if(len > 0.05){
      const nx = mx/len, ny = my/len;
      player.position.x += nx*speed*dt;
      player.position.z += ny*speed*dt;
      const targetAngle = Math.atan2(nx, ny);
      let diff = targetAngle - playerAngle;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      playerAngle += diff * Math.min(1, dt*10);
      player.rotation.y = playerAngle;
    }
    // keep inside cave radius
    const r = Math.hypot(player.position.x, player.position.z);
    if(r > 24){ const ang = Math.atan2(player.position.z, player.position.x); player.position.x = Math.cos(ang)*24; player.position.z = Math.sin(ang)*24; }

    // camera follow
    const camTarget = new THREE.Vector3(player.position.x, 7, player.position.z + 9);
    camera.position.lerp(camTarget, 0.08);
    camera.lookAt(player.position.x, 1, player.position.z);
    torch.position.set(player.position.x, 5, player.position.z);
  }

  function checkCoinPickup(){
    for(let i=coins.length-1;i>=0;i--){
      const c = coins[i];
      if(!c.visible) continue;
      const dx = c.position.x-player.position.x, dz = c.position.z-player.position.z;
      if(Math.hypot(dx,dz) < 1.1){
        c.visible = false;
        collected++;
        document.getElementById('coinCount').textContent = collected;
        if(collected >= TOTAL_COINS) finishGame();
      }
    }
  }

  function finishGame(){
    running = false;
    const elapsed = (performance.now()-startTime)/1000;
    const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
    const ss = String(Math.floor(elapsed%60)).padStart(2,'0');
    document.getElementById('finalTime').textContent = `${mm}:${ss}`;
    document.getElementById('winOverlay').classList.add('show');
  }

  // ---------- LOOP ----------
  let last = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now-last)/1000, 0.05);
    last = now;

    coins.forEach((c,i)=>{ if(c.visible){ c.rotation.z += dt*2; c.position.y = 0.7 + Math.sin(now*0.003 + i)*0.1; } });

    if(running){ updatePlayer(dt); checkCoinPickup(); }
    renderer.render(scene, camera);
  }
  camera.position.set(0,7,9);
  animate();
})();
</script>
</body>
</html>
