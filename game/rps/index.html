<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>दगड-कागद-कात्री — कोडपथ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=JetBrains+Mono:wght@700&display=swap');
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
body{margin:0; min-height:100vh; background:#12141c; color:#ede6d6; font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:26px 16px;}
h1{font-family:'Fraunces',serif; color:#e2725b; font-size:26px; margin:0 0 4px;}
.sub{color:#b8b2a4; font-size:12px; margin-bottom:16px;}
.hud{display:flex; gap:12px; margin-bottom:22px;}
.score-box{background:#20242f; border:1px solid rgba(226,114,91,0.3); border-radius:10px; padding:8px 18px; text-align:center;}
.score-box .lbl{font-size:9px; color:#b8b2a4;} .score-box .val{font-size:20px; font-weight:700; color:#e2725b;}
.arena{display:flex; align-items:center; gap:20px; margin-bottom:26px; min-height:90px;}
.pick{width:80px; height:80px; border-radius:50%; background:#20242f; border:2px solid rgba(226,114,91,0.3); display:flex; align-items:center; justify-content:center; font-size:38px;}
.vs{color:#b8b2a4; font-size:13px;}
.result{font-size:16px; font-weight:700; min-height:24px; margin-bottom:20px; text-align:center;}
.result.win{color:#4ecca3;} .result.lose{color:#e2725b;} .result.draw{color:#e2bc6b;}
.choices{display:flex; gap:16px;}
.choice{width:64px; height:64px; border-radius:50%; background:#20242f; border:2px solid rgba(226,114,91,0.25); font-size:30px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.choice:active{transform:scale(0.92);}
</style>
</head>
<body>
<h1>✊ दगड-कागद-कात्री</h1>
<div class="sub">संगणकाविरुद्ध खेळ — तुझी निवड कर</div>
<div class="hud">
  <div class="score-box"><div class="lbl">तू</div><div class="val" id="pScore">0</div></div>
  <div class="score-box"><div class="lbl">संगणक</div><div class="val" id="cScore">0</div></div>
</div>
<div class="arena">
  <div class="pick" id="playerPick">❔</div>
  <div class="vs">VS</div>
  <div class="pick" id="compPick">❔</div>
</div>
<div class="result" id="result"></div>
<div class="choices">
  <div class="choice" data-c="rock">✊</div>
  <div class="choice" data-c="paper">✋</div>
  <div class="choice" data-c="scissors">✌️</div>
</div>
<script>
const EMOJI={rock:'✊',paper:'✋',scissors:'✌️'};
const BEATS={rock:'scissors',paper:'rock',scissors:'paper'};
let pScore=0, cScore=0;
const playerPickEl=document.getElementById('playerPick'), compPickEl=document.getElementById('compPick'), resultEl=document.getElementById('result');
document.querySelectorAll('.choice').forEach(btn=>{
  btn.addEventListener('click', ()=>play(btn.dataset.c));
});
function play(choice){
  const comp = ['rock','paper','scissors'][Math.floor(Math.random()*3)];
  playerPickEl.textContent=EMOJI[choice];
  compPickEl.textContent=EMOJI[comp];
  resultEl.className='result';
  if(choice===comp){ resultEl.textContent='बरोबरी!'; resultEl.classList.add('draw'); }
  else if(BEATS[choice]===comp){ pScore++; resultEl.textContent='तू जिंकलास! 🎉'; resultEl.classList.add('win'); }
  else { cScore++; resultEl.textContent='संगणक जिंकला.'; resultEl.classList.add('lose'); }
  document.getElementById('pScore').textContent=pScore;
  document.getElementById('cScore').textContent=cScore;
}
</script>
</body>
</html>
