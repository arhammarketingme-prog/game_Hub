<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 — कोडपथ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=JetBrains+Mono:wght@700&display=swap');
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
body{margin:0; min-height:100vh; background:#12141c; color:#ede6d6; font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:24px 16px; touch-action:none;}
h1{font-family:'Fraunces',serif; color:#c9a34e; font-size:28px; margin:0 0 4px;}
.sub{color:#b8b2a4; font-size:12px; margin-bottom:16px;}
.top{display:flex; gap:10px; align-items:center; margin-bottom:16px;}
.score-box{background:#20242f; border:1px solid rgba(201,163,78,0.3); border-radius:10px; padding:8px 16px; text-align:center;}
.score-box .lbl{font-size:9px; color:#b8b2a4; text-transform:uppercase;}
.score-box .val{font-size:18px; font-weight:700; color:#e2bc6b;}
.newbtn{background:#c9a34e; color:#12141c; border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:13px; cursor:pointer;}
#board{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; background:#20242f; padding:8px; border-radius:14px; width:min(90vw,340px); aspect-ratio:1;}
.cell{background:#171a22; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:22px; transition:all .1s;}
.msg{margin-top:16px; color:#4ecca3; font-size:13px; min-height:18px;}
</style>
</head>
<body>
<h1>2048</h1>
<div class="sub">बाण-कळा किंवा स्वाइप वापर — सारख्या टाइल्स एकत्र कर</div>
<div class="top">
  <div class="score-box"><div class="lbl">स्कोअर</div><div class="val" id="score">0</div></div>
  <button class="newbtn" id="newBtn">नवीन खेळ</button>
</div>
<div id="board"></div>
<div class="msg" id="msg"></div>
<script>
const SIZE=4;
let grid, score=0, over=false;
const boardEl=document.getElementById('board'), scoreEl=document.getElementById('score'), msgEl=document.getElementById('msg');
const COLORS={2:'#3a2f1a',4:'#4a3a1e',8:'#c9a34e',16:'#d4ac52',32:'#e2725b',64:'#e8886f',128:'#4ecca3',256:'#3fb894',512:'#22d3ee',1024:'#8b5cf6',2048:'#f472b6'};
function init(){ grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0)); score=0; over=false; msgEl.textContent=''; addTile(); addTile(); render(); }
function addTile(){ const empty=[]; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(!grid[r][c]) empty.push([r,c]); if(!empty.length) return; const [r,c]=empty[Math.floor(Math.random()*empty.length)]; grid[r][c]=Math.random()<0.9?2:4; }
function render(){
  boardEl.innerHTML='';
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const v=grid[r][c]; const cell=document.createElement('div');
    cell.className='cell'; cell.textContent=v||'';
    cell.style.background=v?(COLORS[v]||'#f472b6'):'#171a22';
    cell.style.color=v>4?'#12141c':'#ede6d6';
    boardEl.appendChild(cell);
  }
  scoreEl.textContent=score;
}
function slide(row){
  const arr=row.filter(v=>v);
  for(let i=0;i<arr.length-1;i++){ if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr[i+1]=0; } }
  const merged=arr.filter(v=>v);
  while(merged.length<SIZE) merged.push(0);
  return merged;
}
function move(dir){
  if(over) return;
  let moved=false;
  const before=JSON.stringify(grid);
  if(dir==='left'){ for(let r=0;r<SIZE;r++) grid[r]=slide(grid[r]); }
  if(dir==='right'){ for(let r=0;r<SIZE;r++) grid[r]=slide(grid[r].slice().reverse()).reverse(); }
  if(dir==='up'){ for(let c=0;c<SIZE;c++){ let col=grid.map(r=>r[c]); col=slide(col); for(let r=0;r<SIZE;r++) grid[r][c]=col[r]; } }
  if(dir==='down'){ for(let c=0;c<SIZE;c++){ let col=grid.map(r=>r[c]).reverse(); col=slide(col).reverse(); for(let r=0;r<SIZE;r++) grid[r][c]=col[r]; } }
  moved = JSON.stringify(grid)!==before;
  if(moved){ addTile(); render(); checkEnd(); }
}
function checkEnd(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(grid[r][c]===2048){ msgEl.textContent='🎉 जिंकलास! 2048 गाठलंस!'; over=true; return; }
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(!grid[r][c]) return;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(c<SIZE-1 && grid[r][c]===grid[r][c+1]) return;
    if(r<SIZE-1 && grid[r][c]===grid[r+1][c]) return;
  }
  msgEl.textContent='खेळ संपला — जागा उरली नाही.'; over=true;
}
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') move('left');
  if(e.key==='ArrowRight') move('right');
  if(e.key==='ArrowUp') move('up');
  if(e.key==='ArrowDown') move('down');
});
let sx=0, sy=0;
boardEl.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
boardEl.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
}, {passive:true});
document.getElementById('newBtn').addEventListener('click', init);
init();
</script>
</body>
</html>
