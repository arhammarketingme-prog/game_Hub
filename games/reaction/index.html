<!DOCTYPE html>
<html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>रिअॅक्शन टेस्ट — कोडपथ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=JetBrains+Mono:wght@700&display=swap');
*{box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent;}
body{margin:0; height:100vh; background:#12141c; color:#ede6d6; font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;}
h1{font-family:'Fraunces',serif; color:#4ecca3; font-size:24px; margin:0 0 20px;}
#zone{width:min(85vw,320px); height:280px; border-radius:16px; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px; cursor:pointer; transition:background .15s;}
#zone.wait{background:#20242f; border:2px solid rgba(78,204,163,0.25);}
#zone.ready{background:#e2725b;}
#zone.go{background:#4ecca3;}
#zone .big{font-size:20px; font-weight:700; color:#fff;}
#zone.wait .big{color:#b8b2a4;}
.stats{margin-top:16px; font-size:13px; color:#b8b2a4;}
.stats b{color:#e2bc6b;}
</style></head>
<body>
<h1>⚡ रिअॅक्शन टेस्ट</h1>
<div id="zone" class="wait"><div class="big">सुरू करण्यासाठी टॅप कर</div></div>
<div class="stats">शेवटचा वेळ: <b id="last">—</b> ms &nbsp;|&nbsp; सर्वोत्तम: <b id="best">—</b> ms</div>
<script>
const zone=document.getElementById('zone'), lastEl=document.getElementById('last'), bestEl=document.getElementById('best');
let state='idle', startTime, timeout, best=null;
zone.addEventListener('click', ()=>{
  if(state==='idle' || state==='result'){
    state='waiting'; zone.className='wait'; zone.innerHTML='<div class="big">हिरवं होईपर्यंत थांब...</div>';
    const delay=1000+Math.random()*2500;
    timeout=setTimeout(()=>{ state='go'; zone.className='go'; zone.innerHTML='<div class="big">आत्ता टॅप कर!</div>'; startTime=performance.now(); }, delay);
  } else if(state==='go'){
    const rt=Math.round(performance.now()-startTime);
    lastEl.textContent=rt;
    if(best===null||rt<best){ best=rt; bestEl.textContent=best; }
    state='result'; zone.className='wait'; zone.innerHTML=`<div class="big">${rt} ms! पुन्हा टॅप कर</div>`;
  } else if(state==='waiting'){
    clearTimeout(timeout);
    state='result'; zone.className='wait'; zone.innerHTML='<div class="big">खूप लवकर! पुन्हा टॅप कर</div>';
  }
});
</script>
</body></html>
