<!DOCTYPE html>
<html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>मॅथ स्प्रिंट — कोडपथ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=JetBrains+Mono:wght@700&display=swap');
*{box-sizing:border-box; user-select:none;}
body{margin:0; min-height:100vh; background:#12141c; color:#ede6d6; font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:26px 16px;}
h1{font-family:'Fraunces',serif; color:#3b82f6; font-size:24px; margin:0 0 4px;}
.hud{display:flex; gap:10px; margin-bottom:20px;}
.box{background:#20242f; border:1px solid rgba(59,130,246,0.3); border-radius:10px; padding:8px 16px; text-align:center;}
.box .lbl{font-size:9px; color:#b8b2a4;} .box .val{font-size:18px; font-weight:700; color:#3b82f6;}
.q{font-size:34px; font-weight:700; margin-bottom:18px;}
input{font-size:22px; text-align:center; width:140px; padding:10px; border-radius:10px; border:1px solid rgba(59,130,246,0.3); background:#20242f; color:#ede6d6; font-family:inherit;}
.startbtn{margin-top:16px; background:#3b82f6; color:#fff; border:none; border-radius:10px; padding:11px 22px; font-weight:700; cursor:pointer;}
.result{margin-top:14px; color:#4ecca3; font-size:14px;}
</style></head>
<body>
<h1>➗ मॅथ स्प्रिंट</h1>
<div class="hud">
  <div class="box"><div class="lbl">स्कोअर</div><div class="val" id="score">0</div></div>
  <div class="box"><div class="lbl">वेळ</div><div class="val" id="time">30</div></div>
</div>
<div class="q" id="q">सुरू करण्यासाठी बटण दाब</div>
<input type="number" id="ans" disabled inputmode="numeric">
<div><button class="startbtn" id="startBtn">सुरू कर</button></div>
<div class="result" id="result"></div>
<script>
let score=0, timeLeft=30, running=false, timer, current;
const qEl=document.getElementById('q'), ansEl=document.getElementById('ans'), scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), resultEl=document.getElementById('result');
function newQ(){
  const ops=['+','-','×'];
  const op=ops[Math.floor(Math.random()*ops.length)];
  let a=Math.floor(Math.random()*20)+1, b=Math.floor(Math.random()*20)+1;
  if(op==='×'){ a=Math.floor(Math.random()*12)+1; b=Math.floor(Math.random()*12)+1; }
  if(op==='-' && b>a) [a,b]=[b,a];
  current = op==='+' ? a+b : op==='-' ? a-b : a*b;
  qEl.textContent = `${a} ${op} ${b} = ?`;
  ansEl.value='';
}
function start(){
  score=0; timeLeft=30; running=true; resultEl.textContent='';
  scoreEl.textContent=0; timeEl.textContent=30; ansEl.disabled=false; ansEl.focus();
  newQ();
  clearInterval(timer);
  timer=setInterval(()=>{ timeLeft--; timeEl.textContent=timeLeft; if(timeLeft<=0) finish(); }, 1000);
}
ansEl.addEventListener('input', ()=>{
  if(!running) return;
  if(Number(ansEl.value)===current){ score++; scoreEl.textContent=score; newQ(); }
});
function finish(){
  running=false; clearInterval(timer); ansEl.disabled=true;
  resultEl.textContent = `पूर्ण! स्कोअर: ${score}`;
}
document.getElementById('startBtn').addEventListener('click', start);
</script>
</body></html>
