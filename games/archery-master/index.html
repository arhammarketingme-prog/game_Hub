<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Archery Master — GameHub</title>
<style>
  :root{ --volt:#C6FF3D; --violet:#7A5CFF; --hot:#FF3D6E; --gold:#FFD65C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{background:#0e1408;overflow:hidden;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:linear-gradient(180deg,#1a2410,#0e1408 85%);}
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none;}
  .pill{background:rgba(20,20,31,0.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:6px 12px;font-size:12px;color:#F3F3F7;font-weight:600;display:flex;align-items:center;gap:6px;}
  .pill b{color:var(--gold);font-family:monospace;}
  .icon-btn{pointer-events:all;width:36px;height:36px;border-radius:50%;background:rgba(20,20,31,0.75);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .result-toast{position:absolute;top:90px;left:50%;transform:translate(-50%,0);padding:8px 22px;border-radius:20px;font-weight:900;font-size:16px;z-index:6;opacity:0;transition:opacity .2s;pointer-events:none;}
  .result-toast.show{opacity:1;}
  .r-good{background:rgba(198,255,61,0.92);color:#0A0A0F;}
  .r-ok{background:rgba(255,214,92,0.92);color:#221a00;}
  .r-miss{background:rgba(148,148,166,0.9);color:#0A0A0F;}
  .overlay{position:absolute;inset:0;background:rgba(4,8,3,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;}
  .hidden{display:none;}
  .title{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;background:linear-gradient(90deg,var(--gold),var(--volt));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#9494A6;font-size:13px;margin-bottom:24px;max-width:280px;line-height:1.5;}
  .btn{padding:14px 30px;border-radius:9px;font-weight:800;font-size:15px;border:none;margin-bottom:12px;min-width:220px;}
  .btn-primary{background:var(--volt);color:#0A0A0F;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16);}
  .statrow{display:flex;gap:22px;margin-bottom:26px;}
  .stat{text-align:center;}
  .stat b{display:block;font-size:22px;font-family:monospace;color:var(--gold);}
  .stat span{font-size:11px;color:#9494A6;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div style="display:flex;gap:8px;">
      <div class="pill">🏹 <b id="scoreLabel">0</b></div>
      <div class="pill">🎯 <b id="arrowLabel">1</b>/<b id="arrowTotal">8</b></div>
    </div>
    <a class="icon-btn" href="../../game.html?id=archery-master">✕</a>
  </div>
  <div class="result-toast" id="resultToast"></div>

  <div class="overlay" id="startScreen">
    <div class="title">ARCHERY MASTER</div>
    <div class="sub">Drag back from the bow to aim and set power, then release to shoot. The target drifts side to side — lead your shot. 8 arrows per round.</div>
    <button class="btn btn-primary" id="startBtn">▶ Play Now</button>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="title" id="overTitle">ROUND OVER</div>
    <div class="statrow">
      <div class="stat"><b id="finalScore">0</b><span>SCORE</span></div>
      <div class="stat"><b id="finalBest">0</b><span>BEST</span></div>
    </div>
    <button class="btn btn-primary" id="retryBtn">⟲ Shoot Again</button>
    <a class="btn btn-ghost" href="../../game.html?id=archery-master" style="text-decoration:none;display:block;text-align:center;">🎮 Back to GameHub</a>
  </div>
</div>

<script>
/* ============================================================
   ARCHERY MASTER — drag-to-aim bow shooting
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let SCALE = 1;
function resize(){
  canvas.width = innerWidth; canvas.height = innerHeight;
  SCALE = Math.min(2.1, Math.max(0.85, Math.min(canvas.width, canvas.height) / 420));
}
resize(); addEventListener('resize', resize);

let audioCtx=null;
function beep(freq,dur,type='square',vol=0.05){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

let state='menu';
let bowX=0, bowY=0, targetX=0, targetY=0, targetDir=1, targetSpeed=1.4;
let arrow=null, arrows=[], score=0, arrowNum=1, arrowTotal=8;
let best = parseInt(localStorage.getItem('am_best')||'0');
let dragging=false, dragStart={x:0,y:0}, dragNow={x:0,y:0};
let lastTick=0;

function resetGame(){
  bowX = canvas.width*0.18; bowY = canvas.height*0.72;
  targetX = canvas.width*0.75; targetY = canvas.height*0.35;
  targetDir=1; targetSpeed = 1.4;
  arrow=null; arrows=[]; score=0; arrowNum=1;
  updateHUD();
}

function update(dt){
  if(state!=='playing') return;
  targetX += targetDir*targetSpeed*(dt*60);
  if(targetX > canvas.width*0.92 || targetX < canvas.width*0.55) targetDir*=-1;

  arrows.forEach(a=>{
    if(!a.done){
      a.x += a.vx*dt*60; a.y += a.vy*dt*60;
      a.vy += 0.35*dt*60*0.06;
      if(a.x > canvas.width+30 || a.y > canvas.height+30){ a.done=true; }
      const d = Math.hypot(a.x-targetX, a.y-targetY);
      if(d < 45*SCALE && !a.scored){
        a.scored=true; a.done=true;
        scoreHit(d);
      }
    }
  });
  arrows = arrows.filter(a=>!a.done || performance.now()-a.doneAt < 400);
}

function scoreHit(d){
  let pts=0, msg='', cls='';
  if(d<12*SCALE){ pts=10; msg='BULLSEYE!'; cls='r-good'; beep(880,0.2,'triangle'); }
  else if(d<25*SCALE){ pts=5; msg='+5'; cls='r-good'; beep(700,0.15,'triangle'); }
  else { pts=2; msg='+2'; cls='r-ok'; beep(500,0.1,'square'); }
  score += pts;
  toast(msg, cls);
  updateHUD();
}

function missShot(){
  toast('MISS', 'r-miss');
  beep(200,0.2,'sawtooth',0.04);
}

function toast(msg, cls){
  const t=document.getElementById('resultToast');
  t.textContent=msg; t.className='result-toast show '+cls;
  setTimeout(()=>t.classList.remove('show'), 600);
}

function updateHUD(){
  document.getElementById('scoreLabel').textContent = score;
  document.getElementById('arrowLabel').textContent = Math.min(arrowNum,arrowTotal);
  document.getElementById('arrowTotal').textContent = arrowTotal;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // ground
  ctx.fillStyle='rgba(255,255,255,0.04)';
  ctx.fillRect(0, canvas.height*0.85, canvas.width, canvas.height*0.15);

  // target
  ['#FF3D6E','#F3F3F7','#3DD9FF'].forEach((c,i)=>{
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(targetX,targetY,(45-i*13)*SCALE,0,7); ctx.fill();
  });
  ctx.fillStyle='#FFD65C';
  ctx.beginPath(); ctx.arc(targetX,targetY,8*SCALE,0,7); ctx.fill();

  // bow
  ctx.save();
  ctx.translate(bowX,bowY);
  ctx.strokeStyle='#7A5CFF'; ctx.lineWidth=4*SCALE; ctx.shadowColor='#7A5CFF'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.arc(0,0,30*SCALE,-Math.PI/2.3,Math.PI/2.3); ctx.stroke();
  ctx.shadowBlur=0;
  if(dragging){
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5;
    const dx=dragNow.x-dragStart.x, dy=dragNow.y-dragStart.y;
    const pull=Math.min(80, Math.hypot(dx,dy));
    ctx.beginPath(); ctx.moveTo(0,-24*SCALE); ctx.lineTo(-pull,0); ctx.lineTo(0,24*SCALE); ctx.stroke();
  }
  ctx.restore();

  arrows.forEach(a=>{
    ctx.save();
    ctx.translate(a.x,a.y);
    ctx.rotate(Math.atan2(a.vy,a.vx));
    ctx.strokeStyle='#F3F3F7'; ctx.lineWidth=3*SCALE;
    ctx.beginPath(); ctx.moveTo(-16*SCALE,0); ctx.lineTo(16*SCALE,0); ctx.stroke();
    ctx.fillStyle='#F3F3F7';
    ctx.beginPath(); ctx.moveTo(16*SCALE,0); ctx.lineTo(9*SCALE,-4*SCALE); ctx.lineTo(9*SCALE,4*SCALE); ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}

function loop(ts){
  if(!lastTick) lastTick=ts;
  const dt=Math.min(0.05,(ts-lastTick)/1000);
  lastTick=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function getPos(e){
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX-r.left, y: t.clientY-r.top };
}

canvas.addEventListener('touchstart', e=>{
  if(state!=='playing') return;
  e.preventDefault();
  dragging=true; dragStart=getPos(e); dragNow=dragStart;
}, {passive:false});
canvas.addEventListener('touchmove', e=>{
  if(!dragging) return; e.preventDefault();
  dragNow=getPos(e);
}, {passive:false});
canvas.addEventListener('touchend', e=>{
  if(!dragging) return;
  dragging=false;
  fireArrow();
}, {passive:true});

canvas.addEventListener('mousedown', e=>{ if(state!=='playing') return; dragging=true; dragStart=getPos(e); dragNow=dragStart; });
addEventListener('mousemove', e=>{ if(dragging) dragNow=getPos(e); });
addEventListener('mouseup', ()=>{ if(dragging){ dragging=false; fireArrow(); } });

function fireArrow(){
  if(state!=='playing' || arrowNum>arrowTotal) return;
  const dx=dragNow.x-dragStart.x, dy=dragNow.y-dragStart.y;
  const pull=Math.min(80,Math.hypot(dx,dy));
  if(pull<15){ return; }
  const angle=Math.atan2(dy,dx);
  const power = 8 + pull*0.14;
  arrows.push({ x:bowX, y:bowY, vx:-Math.cos(angle)*power, vy:-Math.abs(Math.sin(angle))*power - 4, done:false, doneAt:0 });
  beep(300,0.08,'triangle',0.04);
  arrowNum++;
  updateHUD();
  setTimeout(()=>{
    if(arrowNum>arrowTotal) finishRound();
  }, 900);
}

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

document.getElementById('startBtn').onclick = () => { hide('startScreen'); resetGame(); state='playing'; };
document.getElementById('retryBtn').onclick = () => { hide('overScreen'); resetGame(); state='playing'; };

function finishRound(){
  if(state!=='playing') return;
  state='over';
  if(score>best){ best=score; localStorage.setItem('am_best', best); }
  document.getElementById('overTitle').textContent = score>=50 ? 'MASTER ARCHER!' : 'ROUND OVER';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = best;
  show('overScreen');
}
</script>
</body>
</html>
