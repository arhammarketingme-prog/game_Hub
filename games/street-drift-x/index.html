<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Street Drift X — GameHub</title>
<style>
  :root{ --volt:#C6FF3D; --violet:#7A5CFF; --hot:#FF3D6E; --pink:#FF5CD0; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{background:#12081a;overflow:hidden;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:linear-gradient(180deg,#1c0e28,#12081a 85%);}
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none;}
  .pill{background:rgba(20,20,31,0.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:6px 12px;font-size:12px;color:#F3F3F7;font-weight:600;display:flex;align-items:center;gap:6px;}
  .pill b{color:var(--volt);font-family:monospace;}
  .icon-btn{pointer-events:all;width:36px;height:36px;border-radius:50%;background:rgba(20,20,31,0.75);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .combo-toast{position:absolute;top:90px;left:50%;transform:translate(-50%,0);background:rgba(255,92,208,0.92);color:#1a0714;font-weight:900;padding:8px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;}
  .combo-toast.show{opacity:1;}
  .touch-zones{position:absolute;inset:0;bottom:0;display:flex;z-index:4;}
  .touch-zones div{flex:1;}
  .drift-btn{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;z-index:6;border:none;box-shadow:0 4px 18px rgba(255,92,208,0.4);}
  .drift-btn:active{transform:translateX(-50%) scale(0.92);}
  .overlay{position:absolute;inset:0;background:rgba(5,5,10,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;}
  .hidden{display:none;}
  .title{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;background:linear-gradient(90deg,var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#9494A6;font-size:13px;margin-bottom:24px;max-width:280px;line-height:1.5;}
  .btn{padding:14px 30px;border-radius:9px;font-weight:800;font-size:15px;border:none;margin-bottom:12px;min-width:220px;}
  .btn-primary{background:var(--volt);color:#0A0A0F;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16);}
  .statrow{display:flex;gap:22px;margin-bottom:26px;}
  .stat{text-align:center;}
  .stat b{display:block;font-size:22px;font-family:monospace;color:var(--pink);}
  .stat span{font-size:11px;color:#9494A6;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div style="display:flex;gap:8px;">
      <div class="pill">⭐ <b id="scoreLabel">0</b></div>
      <div class="pill">✖ <b id="multLabel">x1</b></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="pauseBtn">⏸</button>
      <a class="icon-btn" href="../../game.html?id=street-drift-x">✕</a>
    </div>
  </div>
  <div class="combo-toast" id="comboToast"></div>
  <div class="touch-zones" id="touchZones"><div id="zoneLeft"></div><div id="zoneRight"></div></div>
  <button class="drift-btn" id="driftBtn">HOLD<br>DRIFT</button>

  <div class="overlay" id="startScreen">
    <div class="title">STREET DRIFT X</div>
    <div class="sub">Tap left/right to steer lanes. Hold the DRIFT button through curves to build a score multiplier. Release cleanly to bank it.</div>
    <button class="btn btn-primary" id="startBtn">▶ Play Now</button>
  </div>
  <div class="overlay hidden" id="pauseScreen">
    <div class="title" style="font-size:24px;">PAUSED</div>
    <button class="btn btn-primary" id="resumeBtn">▶ Resume</button>
    <button class="btn btn-ghost" id="restartBtnPause">⟲ Restart</button>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="title" style="color:#FF3D6E;-webkit-text-fill-color:#FF3D6E;">SPUN OUT</div>
    <div class="statrow">
      <div class="stat"><b id="finalScore">0</b><span>SCORE</span></div>
      <div class="stat"><b id="finalBest">0</b><span>BEST</span></div>
    </div>
    <button class="btn btn-primary" id="retryBtn">⟲ Drift Again</button>
    <a class="btn btn-ghost" href="../../game.html?id=street-drift-x" style="text-decoration:none;display:block;text-align:center;">🎮 Back to GameHub</a>
  </div>
</div>

<script>
/* ============================================================
   STREET DRIFT X — 3-lane racer with hold-to-drift multiplier
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let SCALE = 1;
function resize(){
  canvas.width = innerWidth; canvas.height = innerHeight;
  SCALE = Math.min(2.1, Math.max(0.85, Math.min(canvas.width, canvas.height) / 420));
}
resize(); addEventListener('resize', resize);

let audioCtx=null;
function beep(freq,dur,type='square',vol=0.05){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

const LANES = 3;
let state='menu';
let lane=1, carX=0, carY=0;
let curves=[], traffic=[], particles=[];
let dist=0, speed=6, spawnTimer=0, score=0, mult=1, drifting=false, driftHeat=0;
let inCurve=false, curveDir=0;
let best=parseInt(localStorage.getItem('sdx_best')||'0');
let lastTick=0;

function laneX(i){ const w=canvas.width/LANES; return w*i+w/2; }

function resetGame(){
  lane=1; curves=[]; traffic=[]; particles=[];
  dist=0; speed=6; spawnTimer=0; score=0; mult=1; drifting=false; driftHeat=0; inCurve=false;
  carX=laneX(lane); carY=canvas.height*0.8;
  updateHUD();
}

function spawnObstacle(){
  const l = Math.floor(Math.random()*LANES);
  traffic.push({ lane:l, y:-50 });
  if(Math.random()<0.35){ curves.push({ y:-80, dir: Math.random()<0.5?-1:1, active:true }); }
}

function update(dt){
  if(state!=='playing') return;
  speed = Math.min(17, 6+dist/300);
  dist += speed*dt*3;

  const targetX = laneX(lane);
  carX += (targetX-carX)*0.25;

  spawnTimer -= dt;
  if(spawnTimer<=0){ spawnObstacle(); spawnTimer = Math.max(0.5, 1.1-dist/1100); }

  traffic.forEach(t=>t.y+=speed*60*dt);
  curves.forEach(c=>c.y+=speed*60*dt);

  traffic.forEach(t => {
    if(!t.dead && t.lane===lane && Math.abs(t.y-carY)<32){ crash(); }
  });

  curves.forEach(c => {
    if(!c.dead && Math.abs(c.y-carY) < 40){
      inCurve = true; curveDir = c.dir;
      if(drifting){
        driftHeat += dt*40;
        mult = Math.min(8, 1+Math.floor(driftHeat/20));
      }
    }
  });
  const stillInCurve = curves.some(c=>!c.dead && Math.abs(c.y-carY)<40);
  if(!stillInCurve && inCurve){
    inCurve=false;
    if(drifting && driftHeat>10){
      score += Math.round(driftHeat*mult);
      beep(500+mult*40, 0.12, 'triangle');
      showCombo(mult);
    }
    driftHeat=0; mult=1;
  }

  traffic = traffic.filter(t=>!t.dead && t.y<canvas.height+60);
  curves = curves.filter(c=>!c.dead && c.y<canvas.height+80);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});
  particles = particles.filter(p=>p.life>0);

  score += Math.round(speed*dt*2);
  updateHUD();
}

function showCombo(n){
  const t=document.getElementById('comboToast');
  t.textContent = `DRIFT x${n}!`; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 700);
}

function updateHUD(){
  document.getElementById('scoreLabel').textContent = score;
  document.getElementById('multLabel').textContent = 'x'+mult;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const w = canvas.width/LANES;
  ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.setLineDash([16,14]);
  for(let i=1;i<LANES;i++){ ctx.beginPath(); ctx.moveTo(w*i,0); ctx.lineTo(w*i,canvas.height); ctx.stroke(); }
  ctx.setLineDash([]);

function drawCarShape(w, h, bodyColor, glowColor){
  ctx.shadowColor = glowColor; ctx.shadowBlur = 12;
  ctx.fillStyle = bodyColor;
  const r = w*0.22;
  ctx.beginPath();
  ctx.moveTo(-w/2+r, -h/2);
  ctx.arcTo(w/2, -h/2, w/2, -h/2+r, r);
  ctx.lineTo(w/2, h/2-r);
  ctx.arcTo(w/2, h/2, w/2-r, h/2, r);
  ctx.lineTo(-w/2+r, h/2);
  ctx.arcTo(-w/2, h/2, -w/2, h/2-r, r);
  ctx.lineTo(-w/2, -h/2+r);
  ctx.arcTo(-w/2, -h/2, -w/2+r, -h/2, r);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(20,20,31,0.55)';
  ctx.fillRect(-w*0.32, -h*0.32, w*0.64, h*0.28);
  ctx.fillStyle = '#14141F';
  const ww=w*0.16, wh=h*0.2;
  ctx.fillRect(-w/2-ww*0.3, -h*0.32, ww, wh);
  ctx.fillRect(w/2-ww*0.7, -h*0.32, ww, wh);
  ctx.fillRect(-w/2-ww*0.3, h*0.12, ww, wh);
  ctx.fillRect(w/2-ww*0.7, h*0.12, ww, wh);
}

  curves.forEach(c => {
    ctx.fillStyle = 'rgba(255,92,208,0.15)';
    ctx.fillRect(0, c.y-20, canvas.width, 40);
  });

  traffic.forEach(t => {
    ctx.save();
    ctx.translate(laneX(t.lane), t.y);
    drawCarShape(34*SCALE, 54*SCALE, '#FF3D6E', '#FF3D6E');
    ctx.restore();
  });

  particles.forEach(p => { ctx.globalAlpha=p.life/20; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); ctx.globalAlpha=1; });

  if(state==='playing' || state==='paused'){
    ctx.save();
    ctx.translate(carX,carY);
    if(drifting && inCurve) ctx.rotate(curveDir*0.25);
    drawCarShape(32*SCALE, 56*SCALE, drifting ? '#FF5CD0' : '#F3F3F7', drifting ? '#FF5CD0' : '#7A5CFF');
    ctx.restore();
    if(drifting){
      for(let i=0;i<2;i++) particles.push({x:carX+(Math.random()-0.5)*20, y:carY+26, vx:(Math.random()-0.5)*1, vy:2, life:14, color:'#FF5CD0'});
    }
  }
}

function loop(ts){
  if(!lastTick) lastTick=ts;
  const dt=Math.min(0.05,(ts-lastTick)/1000);
  lastTick=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function moveLeft(){ if(lane>0) lane--; }
function moveRight(){ if(lane<LANES-1) lane++; }
document.getElementById('zoneLeft').addEventListener('touchstart', e=>{e.preventDefault(); moveLeft();}, {passive:false});
document.getElementById('zoneRight').addEventListener('touchstart', e=>{e.preventDefault(); moveRight();}, {passive:false});
document.getElementById('zoneLeft').addEventListener('mousedown', moveLeft);
document.getElementById('zoneRight').addEventListener('mousedown', moveRight);
const driftBtn = document.getElementById('driftBtn');
driftBtn.addEventListener('touchstart', e=>{e.preventDefault(); drifting=true;}, {passive:false});
driftBtn.addEventListener('touchend', e=>{e.preventDefault(); drifting=false;}, {passive:false});
driftBtn.addEventListener('mousedown', ()=>drifting=true);
driftBtn.addEventListener('mouseup', ()=>drifting=false);
addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') moveLeft();
  if(e.key==='ArrowRight') moveRight();
  if(e.key===' ') drifting=true;
});
addEventListener('keyup', e=>{ if(e.key===' ') drifting=false; });

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

document.getElementById('startBtn').onclick = () => { resetGame(); hide('startScreen'); state='playing'; };
document.getElementById('pauseBtn').onclick = () => { if(state==='playing'){ state='paused'; show('pauseScreen'); } };
document.getElementById('resumeBtn').onclick = () => { hide('pauseScreen'); state='playing'; };
document.getElementById('restartBtnPause').onclick = () => { hide('pauseScreen'); resetGame(); state='playing'; };
document.getElementById('retryBtn').onclick = () => { hide('overScreen'); resetGame(); state='playing'; };

function crash(){
  if(state!=='playing') return;
  state='over'; beep(110,0.4,'sawtooth',0.08);
  if(score>best){ best=score; localStorage.setItem('sdx_best', best); }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = best;
  show('overScreen');
}
</script>
</body>
</html>
