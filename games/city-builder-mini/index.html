<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Builder Mini — GameHub</title>
<style>
  :root{ --volt:#C6FF3D; --violet:#7A5CFF; --hot:#FF3D6E; --gold:#FFD65C; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;background:#0a0e16;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;color:#F3F3F7;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0%,#131c2e,#0a0e16 70%);}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:6px;flex-wrap:wrap;}
  .pill{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;display:flex;gap:5px;align-items:center;}
  .pill b{color:var(--gold);font-family:monospace;}
  .icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;text-decoration:none;}
  .goalbar{padding:0 16px 8px;font-size:11.5px;color:#9494A6;text-align:center;}
  .goalbar b{color:#fff;}
  .progressbar{height:8px;border-radius:6px;background:rgba(255,255,255,0.08);overflow:hidden;margin:0 16px 10px;}
  .progressfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--volt));width:0%;transition:width .3s;}
  #board{ flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:6px 14px; align-content:center; }
  .plot{ position:relative; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; aspect-ratio:1; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); font-size:20px; }
  .plot.built{ border-color:rgba(198,255,61,0.3); }
  .plot .pop{ position:absolute; bottom:2px; font-size:8px; font-family:monospace; color:#9494A6; }
  .menu-row{ display:flex; gap:8px; padding:8px 14px 12px; overflow-x:auto; }
  .menu-item{ flex:none; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:8px 12px; font-size:11px; text-align:center; min-width:60px; }
  .bottom{padding:0 16px 20px; text-align:center;}
  .btnrow{display:flex; gap:10px;}
  .btn{flex:1;padding:12px;border-radius:9px;font-weight:800;font-size:13px;border:none;}
  .btn-primary{background:var(--volt);color:#0A0A0F;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.14);}
  .overlay{position:absolute;inset:0;background:rgba(4,6,10,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;}
  .hidden{display:none;}
  .title{font-size:26px;font-weight:900;margin-bottom:6px;background:linear-gradient(90deg,var(--gold),var(--volt));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#9494A6;font-size:13px;margin-bottom:24px;max-width:280px;line-height:1.5;}
  .stars{font-size:32px;margin-bottom:16px;letter-spacing:6px;}
  .star-dim{opacity:0.25;}
  .toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(255,214,92,0.92);color:#221a00;padding:8px 18px;border-radius:20px;font-weight:700;font-size:13px;z-index:6;opacity:0;transition:opacity .3s, top .3s;}
  .toast.show{opacity:1;top:80px;}
</style>
</head>
<body>
<div id="app">
  <a href="../../game.html?id=city-builder-mini" style="position:fixed;top:14px;right:14px;z-index:999;width:34px;height:34px;border-radius:50%;background:rgba(20,20,31,0.78);border:1px solid rgba(255,255,255,0.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;text-decoration:none;">✕</a>
  <div class="topbar">
    <a class="icon-btn" href="../../game.html?id=city-builder-mini">←</a>
    <div class="pill">🏙️ City <b id="lvlLabel">1</b></div>
    <div class="pill">👥 <b id="popLabel">0</b></div>
    <div class="pill">🪙 <b id="goldLabel">30</b></div>
  </div>
  <div class="goalbar">Reach <b id="goalLabel">50</b> population to grow the city</div>
  <div class="progressbar"><div class="progressfill" id="progressFill"></div></div>

  <div id="board"></div>
  <div class="menu-row" id="menuRow"></div>

  <div class="bottom">
    <div class="btnrow">
      <button class="btn btn-ghost" id="restartBtn">⟲ Restart</button>
      <button class="btn btn-primary" id="collectBtn">💰 Collect Tax</button>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="title">CITY BUILDER MINI</div>
    <div class="sub">Tap the menu to pick a building, then tap an empty plot to place it. Houses grow population, shops and roads support them. Hit the population target to grow the city.</div>
    <button class="btn btn-primary" style="min-width:220px;" id="startBtn">▶ Play Now</button>
  </div>
  <div class="overlay hidden" id="winScreen">
    <div class="title">CITY GROWN!</div>
    <div class="stars" id="starsDisplay">★★★</div>
    <div class="sub">City <span id="wonLvl">1</span> complete.</div>
    <button class="btn btn-primary" style="min-width:220px;margin-bottom:10px;" id="nextBtn">▶ Next City</button>
    <a class="btn btn-ghost" style="min-width:220px;display:block;text-decoration:none;" href="../../game.html?id=city-builder-mini">🎮 Back to GameHub</a>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   CITY BUILDER MINI — grid city building, population target
   ============================================================ */
const BUILDINGS = [
  { key:'house', icon:'🏠', name:'House', cost:8, pop:4 },
  { key:'shop', icon:'🏪', name:'Shop', cost:14, pop:2, boost:1.3 },
  { key:'park', icon:'🌳', name:'Park', cost:6, pop:1, boost:1.15 },
  { key:'road', icon:'🛣️', name:'Road', cost:4, pop:0, boost:1.1 },
];
let level = parseInt(localStorage.getItem('cbm_level')||'1');
let GRID = 20, plots = [], gold=30, population=0, target=50, gameActive=false, cycleIdx=0;

let audioCtx=null;
function beep(freq,dur,type='square',vol=0.05){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function levelConfig(lvl){
  GRID = 20 + Math.min(3,Math.floor(lvl/2))*5;
  target = 40 + lvl*30;
}

function initGame(){
  levelConfig(level);
  gold=30; population=0;
  plots = Array.from({length:GRID}, () => ({ building:null }));
  document.getElementById('lvlLabel').textContent = level;
  document.getElementById('goalLabel').textContent = target;
  document.getElementById('goldLabel').textContent = gold;
  renderMenu();
  renderBoard();
  updateHUD();
}

function renderMenu(){
  const row = document.getElementById('menuRow');
  row.innerHTML = BUILDINGS.map(b => `<div class="menu-item">${b.icon}<br>${b.name}<br><span style="color:#9494A6">🪙${b.cost}</span></div>`).join('');
}

function renderBoard(){
  const cols = GRID<=20 ? 5 : GRID<=25 ? 5 : 6;
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  boardEl.innerHTML = '';
  plots.forEach((plot, idx) => {
    const el = document.createElement('div');
    if(!plot.building){
      el.className='plot'; el.innerHTML = '<span>➕</span>';
    } else {
      const def = BUILDINGS.find(b=>b.key===plot.building);
      el.className='plot built';
      el.innerHTML = `<span>${def.icon}</span><span class="pop">+${def.pop}</span>`;
    }
    el.addEventListener('click', () => handleTap(idx));
    boardEl.appendChild(el);
  });
}

function handleTap(idx){
  if(!gameActive) return;
  const plot = plots[idx];
  if(plot.building){ toast('Already built here'); return; }
  const def = BUILDINGS[cycleIdx % BUILDINGS.length]; cycleIdx++;
  if(gold < def.cost){ toast(`Need 🪙${def.cost} for ${def.name}`); return; }
  gold -= def.cost;
  plot.building = def.key;
  beep(500,0.1,'triangle');
  toast(`Built ${def.icon} ${def.name}`);
  renderBoard();
  recalcPopulation();
  updateHUD();
  checkWin();
}

function recalcPopulation(){
  let base=0, boost=1;
  plots.forEach(p => {
    if(!p.building) return;
    const def = BUILDINGS.find(b=>b.key===p.building);
    base += def.pop;
    if(def.boost) boost *= def.boost;
  });
  population = Math.round(base*boost);
}

function collectTax(){
  if(!gameActive) return;
  const tax = Math.round(population*0.8)+5;
  gold += tax;
  beep(700,0.08,'triangle',0.03);
  toast(`+🪙${tax} tax collected`);
  updateHUD();
}

function updateHUD(){
  document.getElementById('popLabel').textContent = population;
  document.getElementById('goldLabel').textContent = gold;
  document.getElementById('progressFill').style.width = Math.min(100, population/target*100)+'%';
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1100);
}

function checkWin(){
  if(population>=target && gameActive){
    gameActive=false;
    const builtCount = plots.filter(p=>p.building).length;
    const starCount = builtCount > GRID*0.6 ? 3 : builtCount > GRID*0.35 ? 2 : 1;
    document.getElementById('starsDisplay').innerHTML =
      Array.from({length:3},(_,i)=> i<starCount ? '★' : '<span class="star-dim">★</span>').join('');
    document.getElementById('wonLvl').textContent = level;
    beep(660,0.15,'triangle'); setTimeout(()=>beep(880,0.2,'triangle'),150);
    show('winScreen');
  }
}

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

document.getElementById('startBtn').onclick = () => { hide('startScreen'); initGame(); gameActive=true; };
document.getElementById('restartBtn').onclick = () => { initGame(); gameActive=true; };
document.getElementById('collectBtn').onclick = collectTax;
document.getElementById('nextBtn').onclick = () => {
  hide('winScreen'); level++; localStorage.setItem('cbm_level', level); initGame(); gameActive=true;
};
</script>
</body>
</html>
