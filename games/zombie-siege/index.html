<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zombie Siege — GameHub</title>
<style>
  :root{ --volt:#C6FF3D; --violet:#7A5CFF; --hot:#FF3D6E; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{background:#0c0d0a;overflow:hidden;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:linear-gradient(180deg,#181c10,#0c0d0a 85%);}
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none;}
  .hud-left{display:flex;flex-direction:column;gap:6px;}
  .pill{background:rgba(20,20,31,0.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:6px 12px;font-size:12px;color:#F3F3F7;font-weight:600;display:flex;align-items:center;gap:6px;}
  .pill b{color:var(--volt);font-family:monospace;}
  .hp-bar{width:110px;height:9px;background:rgba(255,255,255,0.1);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.15);}
  .hp-fill{height:100%;background:linear-gradient(90deg,var(--hot),#ff8a5c);width:100%;transition:width .2s;}
  .icon-btn{pointer-events:all;width:36px;height:36px;border-radius:50%;background:rgba(20,20,31,0.75);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .wave-banner{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:rgba(255,61,110,0.92);color:#fff;padding:8px 22px;border-radius:20px;font-weight:900;font-size:15px;z-index:6;opacity:0;transition:opacity .3s;pointer-events:none;}
  .wave-banner.show{opacity:1;}
  .overlay{position:absolute;inset:0;background:rgba(4,5,3,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;}
  .hidden{display:none;}
  .title{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;background:linear-gradient(90deg,var(--hot),var(--volt));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#9494A6;font-size:13px;margin-bottom:24px;max-width:280px;line-height:1.5;}
  .btn{padding:14px 30px;border-radius:9px;font-weight:800;font-size:15px;border:none;margin-bottom:12px;min-width:220px;}
  .btn-primary{background:var(--volt);color:#0A0A0F;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16);}
  .statrow{display:flex;gap:22px;margin-bottom:26px;}
  .stat{text-align:center;}
  .stat b{display:block;font-size:22px;font-family:monospace;color:var(--volt);}
  .stat span{font-size:11px;color:#9494A6;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="hud-left">
      <div class="pill">🏰 <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div></div>
      <div class="pill">🌊 Wave <b id="waveLabel">1</b></div>
    </div>
    <a class="icon-btn" href="../../game.html?id=zombie-siege">✕</a>
  </div>
  <div class="wave-banner" id="waveBanner">WAVE 1</div>

  <div class="overlay" id="startScreen">
    <div class="title">ZOMBIE SIEGE</div>
    <div class="sub">Tap anywhere on screen to fire at the nearest zombie. Defend your base at the bottom — waves get bigger and faster each round.</div>
    <button class="btn btn-primary" id="startBtn">▶ Play Now</button>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="title" style="color:#FF3D6E;-webkit-text-fill-color:#FF3D6E;">BASE OVERRUN</div>
    <div class="statrow">
      <div class="stat"><b id="finalWave">1</b><span>WAVE REACHED</span></div>
      <div class="stat"><b id="finalKills">0</b><span>KILLS</span></div>
      <div class="stat"><b id="finalBest">1</b><span>BEST WAVE</span></div>
    </div>
    <button class="btn btn-primary" id="retryBtn">⟲ Defend Again</button>
    <a class="btn btn-ghost" href="../../game.html?id=zombie-siege" style="text-decoration:none;display:block;text-align:center;">🎮 Back to GameHub</a>
  </div>
</div>

<script>
/* ============================================================
   ZOMBIE SIEGE — fixed-position tap-to-shoot wave defense
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let SCALE = 1;
function resize(){
  canvas.width = innerWidth; canvas.height = innerHeight;
  SCALE = Math.min(2.1, Math.max(0.85, Math.min(canvas.width, canvas.height) / 420));
}
resize(); addEventListener('resize', resize);

let audioCtx=null;
function beep(freq,dur,type='square',vol=0.05){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

let state='menu';
let baseX=0, baseY=0, baseHp=100, baseMaxHp=100;
let zombies=[], bullets=[], particles=[];
let wave=1, kills=0, zombiesRemaining=0, spawnTimer=0, spawnInterval=1.2;
let best = parseInt(localStorage.getItem('zs_best')||'1');
let lastTick=0;

function resetGame(){
  baseX=canvas.width/2; baseY=canvas.height-40*SCALE; baseHp=100; baseMaxHp=100;
  zombies=[]; bullets=[]; particles=[];
  wave=1; kills=0;
  startWave();
  updateHUD();
}

function startWave(){
  zombiesRemaining = 4 + wave*2;
  spawnInterval = Math.max(0.35, 1.2 - wave*0.05);
  spawnTimer = 0;
  showWaveBanner();
}

function showWaveBanner(){
  const b=document.getElementById('waveBanner');
  b.textContent = `WAVE ${wave}`;
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 1200);
}

function spawnZombie(){
  const x = Math.random()*canvas.width;
  const tough = wave>3 && Math.random()<0.2;
  zombies.push({
    x, y:-30, r:(tough?18:11)*SCALE, hp:(tough?35:10)+wave*1.5, maxHp:(tough?35:10)+wave*1.5,
    speed:(tough?0.5:0.9+Math.random()*0.4)+wave*0.03, dmg:tough?14:7, color: tough?'#7A5CFF':'#8fbf5c'
  });
}

function update(dt){
  if(state!=='playing') return;

  if(zombiesRemaining>0){
    spawnTimer += dt;
    if(spawnTimer>spawnInterval){ spawnTimer=0; spawnZombie(); zombiesRemaining--; }
  } else if(zombies.length===0){
    wave++;
    startWave();
  }

  zombies.forEach(z=>{
    const a=Math.atan2(baseY-z.y, baseX-z.x);
    z.x += Math.cos(a)*z.speed*(dt*60);
    z.y += Math.sin(a)*z.speed*(dt*60);
    if(Math.hypot(z.x-baseX,z.y-baseY) < z.r+30*SCALE && !z.hit){
      z.hit=true; z.dead=true;
      baseHp -= z.dmg;
      spawnParticles(baseX,baseY,'#FF3D6E');
    }
  });

  bullets.forEach(b=>{ b.x+=b.vx*dt*60; b.y+=b.vy*dt*60; b.life--; });
  bullets = bullets.filter(b=>b.life>0);

  bullets.forEach(b=>{
    zombies.forEach(z=>{
      if(b.dead||z.dead) return;
      if(Math.hypot(b.x-z.x,b.y-z.y) < z.r+3){
        z.hp -= 10; b.dead=true;
        spawnParticles(b.x,b.y,z.color);
        if(z.hp<=0){ z.dead=true; kills++; beep(150,0.05,'square',0.02); }
      }
    });
  });
  bullets = bullets.filter(b=>!b.dead);
  zombies = zombies.filter(z=>!z.dead);

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});
  particles = particles.filter(p=>p.life>0);

  if(baseHp<=0){ gameOver(); }
  updateHUD();
}

function spawnParticles(x,y,color){
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*2;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18,color});
  }
}

function fireAt(tx,ty){
  if(state!=='playing') return;
  let nearest=null, nd=999999;
  zombies.forEach(z=>{ const d=Math.hypot(z.x-tx,z.y-ty); if(d<nd){nd=d;nearest=z;} });
  const target = nearest || {x:tx,y:ty};
  const angle = Math.atan2(target.y-baseY, target.x-baseX);
  bullets.push({x:baseX,y:baseY,vx:Math.cos(angle)*9,vy:Math.sin(angle)*9,life:60});
  beep(700,0.04,'square',0.02);
}

function updateHUD(){
  document.getElementById('hpFill').style.width = Math.max(0,(baseHp/baseMaxHp*100))+'%';
  document.getElementById('waveLabel').textContent = wave;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // base
  ctx.fillStyle='rgba(198,255,61,0.12)';
  ctx.fillRect(0, baseY+10*SCALE, canvas.width, canvas.height-baseY);
  ctx.fillStyle='#C6FF3D'; ctx.shadowColor='#C6FF3D'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(baseX,baseY,26*SCALE,0,7); ctx.fill(); ctx.shadowBlur=0;

  particles.forEach(p=>{ ctx.globalAlpha=p.life/18; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); ctx.globalAlpha=1; });

  zombies.forEach(z=>{
    ctx.fillStyle=z.color; ctx.shadowColor=z.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,7); ctx.fill(); ctx.shadowBlur=0;
    if(z.hp<z.maxHp){
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(z.x-z.r,z.y-z.r-8,z.r*2,4);
      ctx.fillStyle='#FF3D6E'; ctx.fillRect(z.x-z.r,z.y-z.r-8,z.r*2*(z.hp/z.maxHp),4);
    }
  });

  bullets.forEach(b=>{
    ctx.fillStyle='#FFD65C'; ctx.shadowColor='#FFD65C'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(b.x,b.y,3,0,7); ctx.fill(); ctx.shadowBlur=0;
  });
}

function loop(ts){
  if(!lastTick) lastTick=ts;
  const dt=Math.min(0.05,(ts-lastTick)/1000);
  lastTick=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function getPos(e){
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX-r.left, y: t.clientY-r.top };
}
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const p=getPos(e); fireAt(p.x,p.y); }, {passive:false});
canvas.addEventListener('click', e=>{ const p=getPos(e); fireAt(p.x,p.y); });

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

document.getElementById('startBtn').onclick = () => { resetGame(); hide('startScreen'); state='playing'; };
document.getElementById('retryBtn').onclick = () => { hide('overScreen'); resetGame(); state='playing'; };

function gameOver(){
  if(state!=='playing') return;
  state='over'; beep(110,0.4,'sawtooth',0.08);
  if(wave>best){ best=wave; localStorage.setItem('zs_best', best); }
  document.getElementById('finalWave').textContent = wave;
  document.getElementById('finalKills').textContent = kills;
  document.getElementById('finalBest').textContent = best;
  show('overScreen');
}
</script>
</body>
</html>
