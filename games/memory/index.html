<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>मेमरी मॅच — कोडपथ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=JetBrains+Mono:wght@700&display=swap');
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
body{margin:0; min-height:100vh; background:#12141c; color:#ede6d6; font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:22px 16px;}
h1{font-family:'Fraunces',serif; color:#f472b6; font-size:26px; margin:0 0 4px;}
.sub{color:#b8b2a4; font-size:12px; margin-bottom:14px;}
.hud{display:flex; gap:10px; margin-bottom:16px;}
.score-box{background:#20242f; border:1px solid rgba(244,114,182,0.3); border-radius:10px; padding:7px 16px; text-align:center;}
.score-box .lbl{font-size:9px; color:#b8b2a4;} .score-box .val{font-size:16px; font-weight:700; color:#f472b6;}
.newbtn{background:#f472b6; color:#12141c; border:none; border-radius:10px; padding:9px 16px; font-weight:700; font-size:12px; cursor:pointer;}
#grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; width:min(90vw,340px);}
.card{aspect-ratio:1; background:#20242f; border:1px solid rgba(244,114,182,0.25); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; transition:transform .15s;}
.card.flipped{background:#2a2438;}
.card.matched{background:#1c2a25; border-color:#4ecca3; opacity:0.6; cursor:default;}
.msg{margin-top:16px; color:#4ecca3; font-size:13px; min-height:18px; text-align:center;}
</style>
</head>
<body>
<h1>🧠 मेमरी मॅच</h1>
<div class="sub">दोन कार्ड उघड — जोडी जुळली तर तशीच राहील</div>
<div class="hud">
  <div class="score-box"><div class="lbl">चाली</div><div class="val" id="moves">0</div></div>
  <div class="score-box"><div class="lbl">जोड्या</div><div class="val" id="pairs">0/8</div></div>
  <button class="newbtn" id="newBtn">नवीन</button>
</div>
<div id="grid"></div>
<div class="msg" id="msg"></div>
<script>
const EMOJIS=['🐯','🦋','🌸','🍀','⭐','🔥','🌙','🍎'];
let cards, flipped, matchedCount, moves, lock;
const gridEl=document.getElementById('grid'), movesEl=document.getElementById('moves'), pairsEl=document.getElementById('pairs'), msgEl=document.getElementById('msg');

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function init(){
  cards = shuffle([...EMOJIS, ...EMOJIS]).map((e,i)=>({id:i, emoji:e, flipped:false, matched:false}));
  flipped=[]; matchedCount=0; moves=0; lock=false;
  msgEl.textContent=''; movesEl.textContent=0; pairsEl.textContent='0/8';
  render();
}
function render(){
  gridEl.innerHTML='';
  cards.forEach(c=>{
    const el=document.createElement('div');
    el.className='card'+(c.flipped?' flipped':'')+(c.matched?' matched':'');
    el.textContent=(c.flipped||c.matched)?c.emoji:'❔';
    el.addEventListener('click', ()=>flip(c.id));
    gridEl.appendChild(el);
  });
}
function flip(id){
  if(lock) return;
  const c=cards.find(x=>x.id===id);
  if(c.flipped||c.matched) return;
  c.flipped=true; flipped.push(c);
  render();
  if(flipped.length===2){
    moves++; movesEl.textContent=moves;
    lock=true;
    setTimeout(()=>{
      const [a,b]=flipped;
      if(a.emoji===b.emoji){ a.matched=true; b.matched=true; matchedCount++; pairsEl.textContent=`${matchedCount}/8`; }
      else { a.flipped=false; b.flipped=false; }
      flipped=[]; lock=false; render();
      if(matchedCount===8) msgEl.textContent=`🎉 पूर्ण झालं! ${moves} चालींमध्ये जिंकलास.`;
    }, 700);
  }
}
document.getElementById('newBtn').addEventListener('click', init);
init();
</script>
</body>
</html>
