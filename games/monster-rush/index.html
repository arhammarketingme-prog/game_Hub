<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Monster Rush — GameHub</title>
<style>
  :root{ --volt:#C6FF3D; --violet:#7A5CFF; --hot:#FF3D6E; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{background:#100a14;overflow:hidden;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:radial-gradient(circle at 50% 45%,#221430,#100a14 75%);}
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none;}
  .hud-left{display:flex;flex-direction:column;gap:6px;}
  .pill{background:rgba(20,20,31,0.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:6px 12px;font-size:12px;color:#F3F3F7;font-weight:600;display:flex;align-items:center;gap:6px;}
  .pill b{color:var(--volt);font-family:monospace;}
  .hp-bar{width:110px;height:9px;background:rgba(255,255,255,0.1);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.15);}
  .hp-fill{height:100%;background:linear-gradient(90deg,var(--hot),#ff8a5c);width:100%;transition:width .2s;}
  .icon-btn{pointer-events:all;width:36px;height:36px;border-radius:50%;background:rgba(20,20,31,0.75);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .stick-zone{position:absolute;left:0;bottom:0;width:45%;height:45%;z-index:4;}
  .stick-base{position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(198,255,61,0.35);display:none;}
  .stick-knob{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(198,255,61,0.55);top:28px;left:28px;}
  .overlay{position:absolute;inset:0;background:rgba(6,4,8,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;}
  .hidden{display:none;}
  .title{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;background:linear-gradient(90deg,var(--hot),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#9494A6;font-size:13px;margin-bottom:24px;max-width:280px;line-height:1.5;}
  .btn{padding:14px 30px;border-radius:9px;font-weight:800;font-size:15px;border:none;margin-bottom:12px;min-width:220px;}
  .btn-primary{background:var(--volt);color:#0A0A0F;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16);}
  .statrow{display:flex;gap:22px;margin-bottom:26px;}
  .stat{text-align:center;}
  .stat b{display:block;font-size:22px;font-family:monospace;color:var(--volt);}
  .stat span{font-size:11px;color:#9494A6;}
  .upgrade-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:14px;margin-bottom:10px;width:260px;text-align:left;}
  .upgrade-card b{color:var(--volt);display:block;font-size:14px;margin-bottom:2px;}
  .upgrade-card span{font-size:12px;color:#9494A6;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="hud-left">
      <div class="pill">❤️ <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div></div>
      <div class="pill">⏱ <b id="timeLabel">00:00</b></div>
    </div>
    <a class="icon-btn" href="../../game.html?id=monster-rush">✕</a>
  </div>
  <div class="stick-zone" id="stickZone"><div class="stick-base" id="stickBase"><div class="stick-knob" id="stickKnob"></div></div></div>

  <div class="overlay" id="startScreen">
    <div class="title">MONSTER RUSH</div>
    <div class="sub">Drag on the left to move. Your weapon auto-fires. Monsters get faster and tougher the longer you survive — grab weapon upgrades that drop.</div>
    <button class="btn btn-primary" id="startBtn">▶ Play Now</button>
  </div>
  <div class="overlay hidden" id="pauseScreen">
    <div class="title" style="font-size:24px;">PAUSED</div>
    <button class="btn btn-primary" id="resumeBtn">▶ Resume</button>
    <button class="btn btn-ghost" id="restartBtnPause">⟲ Restart</button>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="title" style="color:#FF3D6E;-webkit-text-fill-color:#FF3D6E;">OVERRUN</div>
    <div class="statrow">
      <div class="stat"><b id="finalTime">00:00</b><span>SURVIVED</span></div>
      <div class="stat"><b id="finalKills">0</b><span>KILLS</span></div>
      <div class="stat"><b id="finalBest">00:00</b><span>BEST</span></div>
    </div>
    <button class="btn btn-primary" id="retryBtn">⟲ Try Again</button>
    <a class="btn btn-ghost" href="../../game.html?id=monster-rush" style="text-decoration:none;display:block;text-align:center;">🎮 Back to GameHub</a>
  </div>
</div>

<script>
/* ============================================================
   MONSTER RUSH — survival action, weapon pickups
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let SCALE = 1;
function resize(){
  canvas.width = innerWidth; canvas.height = innerHeight;
  SCALE = Math.min(2.1, Math.max(0.85, Math.min(canvas.width, canvas.height) / 420));
}
resize(); addEventListener('resize', resize);

let audioCtx=null;
function beep(freq,dur,type='square',vol=0.05){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

let state='menu';
let player = { x:0, y:0, r:16, hp:100, maxHp:100, lastFire:0, fireRate:400, dmg:9, multishot:1 };
let monsters=[], bullets=[], drops=[], particles=[];
let elapsed=0, kills=0, lastSpawn=0;
let best = parseInt(localStorage.getItem('mr_best')||'0');
let lastTick=0;
let stickVec={x:0,y:0};

function resetGame(){
  player = { x:canvas.width/2, y:canvas.height/2, r:16, hp:100, maxHp:100, lastFire:0, fireRate:400, dmg:9, multishot:1 };
  monsters=[]; bullets=[]; drops=[]; particles=[];
  elapsed=0; kills=0; lastSpawn=0;
  updateHUD();
}

function spawnMonster(){
  const edge = Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){ x=-30; y=Math.random()*canvas.height; }
  else if(edge===1){ x=canvas.width+30; y=Math.random()*canvas.height; }
  else if(edge===2){ x=Math.random()*canvas.width; y=-30; }
  else { x=Math.random()*canvas.width; y=canvas.height+30; }
  const tough = elapsed>20 && Math.random()<0.25;
  monsters.push({
    x,y, r:(tough?20:12)*SCALE, hp:(tough?40:12)+elapsed*0.8, maxHp:(tough?40:12)+elapsed*0.8,
    speed:(tough?0.7:1.1+Math.random()*0.5), dmg:tough?16:8, color: tough?'#7A5CFF':'#FF3D6E'
  });
}

function update(dt){
  if(state!=='playing') return;
  elapsed += dt;

  const spawnInterval = Math.max(0.35, 1.5-elapsed*0.01);
  if(performance.now()/1000 - lastSpawn > spawnInterval){ lastSpawn = performance.now()/1000; spawnMonster(); }

  let mx=stickVec.x, my=stickVec.y;
  const mag = Math.hypot(mx,my);
  if(mag>0.15){
    player.x += (mx/Math.max(mag,1))*2.4*(dt*60);
    player.y += (my/Math.max(mag,1))*2.4*(dt*60);
  }
  player.x = Math.max(player.r, Math.min(canvas.width-player.r, player.x));
  player.y = Math.max(player.r, Math.min(canvas.height-player.r, player.y));

  const now = performance.now();
  if(now-player.lastFire>player.fireRate){
    let nearest=null, nd=999999;
    monsters.forEach(m=>{ const d=Math.hypot(m.x-player.x,m.y-player.y); if(d<nd){nd=d;nearest=m;} });
    if(nearest){
      player.lastFire = now;
      const angle = Math.atan2(nearest.y-player.y, nearest.x-player.x);
      for(let i=0;i<player.multishot;i++){
        const off = player.multishot===1?0:(i/(player.multishot-1)-0.5)*0.3;
        const a = angle+off;
        bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,life:50});
      }
      beep(700,0.04,'square',0.02);
    }
  }

  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;});
  bullets = bullets.filter(b=>b.life>0);

  monsters.forEach(m=>{
    const a=Math.atan2(player.y-m.y,player.x-m.x);
    m.x += Math.cos(a)*m.speed; m.y += Math.sin(a)*m.speed;
    if(Math.hypot(m.x-player.x,m.y-player.y) < m.r+player.r){
      player.hp -= m.dmg*dt;
      spawnParticles(player.x,player.y,'#FF3D6E');
    }
  });

  bullets.forEach(b=>{
    monsters.forEach(m=>{
      if(b.dead||m.dead) return;
      if(Math.hypot(b.x-m.x,b.y-m.y) < m.r+3){
        m.hp -= player.dmg; b.dead=true;
        spawnParticles(b.x,b.y,m.color);
        if(m.hp<=0){
          m.dead=true; kills++;
          if(Math.random()<0.12){ drops.push({x:m.x,y:m.y,r:10*SCALE}); }
          beep(150,0.05,'square',0.02);
        }
      }
    });
  });
  bullets = bullets.filter(b=>!b.dead);
  monsters = monsters.filter(m=>!m.dead);

  drops.forEach(d=>{
    if(Math.hypot(d.x-player.x,d.y-player.y) < d.r+player.r){
      d.dead=true;
      const roll = Math.random();
      if(roll<0.4){ player.fireRate = Math.max(120, player.fireRate*0.85); }
      else if(roll<0.75){ player.dmg *= 1.25; }
      else { player.multishot += 1; }
      beep(880,0.15,'triangle');
    }
  });
  drops = drops.filter(d=>!d.dead);

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});
  particles = particles.filter(p=>p.life>0);

  if(player.hp<=0){ gameOver(); }
  updateHUD();
}

function spawnParticles(x,y,color){
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*2;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18,color});
  }
}

function updateHUD(){
  document.getElementById('hpFill').style.width = Math.max(0,(player.hp/player.maxHp*100))+'%';
  const m=Math.floor(elapsed/60), s=Math.floor(elapsed%60);
  document.getElementById('timeLabel').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drops.forEach(d=>{
    ctx.fillStyle='#FFD65C'; ctx.shadowColor='#FFD65C'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.fill(); ctx.shadowBlur=0;
  });
  particles.forEach(p=>{ ctx.globalAlpha=p.life/18; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); ctx.globalAlpha=1; });
  monsters.forEach(m=>{
    ctx.fillStyle=m.color; ctx.shadowColor=m.color; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,7); ctx.fill(); ctx.shadowBlur=0;
    if(m.hp<m.maxHp){
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(m.x-m.r,m.y-m.r-8,m.r*2,4);
      ctx.fillStyle='#C6FF3D'; ctx.fillRect(m.x-m.r,m.y-m.r-8,m.r*2*(m.hp/m.maxHp),4);
    }
  });
  bullets.forEach(b=>{
    ctx.fillStyle='#C6FF3D'; ctx.shadowColor='#C6FF3D'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(b.x,b.y,3,0,7); ctx.fill(); ctx.shadowBlur=0;
  });
  if(state==='playing'||state==='paused'){
    ctx.fillStyle='#F3F3F7'; ctx.shadowColor='#C6FF3D'; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(player.x,player.y,player.r*SCALE,0,7); ctx.fill(); ctx.shadowBlur=0;
  }
}

function loop(ts){
  if(!lastTick) lastTick=ts;
  const dt=Math.min(0.05,(ts-lastTick)/1000);
  lastTick=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// joystick
const stickZone=document.getElementById('stickZone'), stickBase=document.getElementById('stickBase'), stickKnob=document.getElementById('stickKnob');
let stickId=null, stickOrigin={x:0,y:0};
function stickStart(x,y,id){
  stickId=id; stickOrigin={x,y};
  stickBase.style.display='block';
  stickBase.style.left=(x-50)+'px'; stickBase.style.top=(y-50)+'px';
  stickKnob.style.left='28px'; stickKnob.style.top='28px';
}
function stickMove(x,y){
  let dx=x-stickOrigin.x, dy=y-stickOrigin.y;
  const max=50, dist=Math.hypot(dx,dy);
  if(dist>max){ dx=dx/dist*max; dy=dy/dist*max; }
  stickKnob.style.left=(28+dx)+'px'; stickKnob.style.top=(28+dy)+'px';
  stickVec={x:dx/max,y:dy/max};
}
function stickEnd(){ stickId=null; stickVec={x:0,y:0}; stickBase.style.display='none'; }
stickZone.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; stickStart(t.clientX,t.clientY,t.identifier); }, {passive:true});
stickZone.addEventListener('touchmove', e=>{ for(const t of e.changedTouches){ if(t.identifier===stickId) stickMove(t.clientX,t.clientY); } }, {passive:true});
stickZone.addEventListener('touchend', e=>{ for(const t of e.changedTouches){ if(t.identifier===stickId) stickEnd(); } }, {passive:true});
stickZone.addEventListener('mousedown', e=>stickStart(e.clientX,e.clientY,'m'));
addEventListener('mousemove', e=>{ if(stickId==='m') stickMove(e.clientX,e.clientY); });
addEventListener('mouseup', ()=>{ if(stickId==='m') stickEnd(); });

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

document.getElementById('startBtn').onclick = () => { resetGame(); hide('startScreen'); state='playing'; };
document.getElementById('pauseBtn') && (document.getElementById('pauseBtn').onclick = () => { if(state==='playing'){ state='paused'; show('pauseScreen'); } });
document.getElementById('resumeBtn').onclick = () => { hide('pauseScreen'); state='playing'; };
document.getElementById('restartBtnPause').onclick = () => { hide('pauseScreen'); resetGame(); state='playing'; };
document.getElementById('retryBtn').onclick = () => { hide('overScreen'); resetGame(); state='playing'; };

function gameOver(){
  if(state!=='playing') return;
  state='over'; beep(110,0.4,'sawtooth',0.08);
  if(elapsed>best){ best=elapsed; localStorage.setItem('mr_best', best); }
  const m=Math.floor(elapsed/60), s=Math.floor(elapsed%60);
  const bm=Math.floor(best/60), bs=Math.floor(best%60);
  document.getElementById('finalTime').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.getElementById('finalKills').textContent = kills;
  document.getElementById('finalBest').textContent = `${String(bm).padStart(2,'0')}:${String(bs).padStart(2,'0')}`;
  show('overScreen');
}
</script>
</body>
</html>
