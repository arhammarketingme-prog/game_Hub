<!DOCTYPE html>
<html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>कनेक्ट फोर — कोडपथ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=JetBrains+Mono:wght@700&display=swap');
*{box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent;}
body{margin:0; min-height:100vh; background:#12141c; color:#ede6d6; font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; padding:20px 14px;}
h1{font-family:'Fraunces',serif; color:#e2bc6b; font-size:24px; margin:0 0 4px;}
.sub{color:#b8b2a4; font-size:12px; margin-bottom:12px; text-align:center;}
.turn{background:#20242f; border:1px solid rgba(201,163,78,0.3); border-radius:10px; padding:7px 16px; margin-bottom:12px; font-weight:700; font-size:13px;}
.turn .y{color:#e2bc6b;} .turn .r{color:#e2725b;}
#board{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; background:#1e3a5f; padding:8px; border-radius:12px; width:min(94vw,350px); aspect-ratio:7/6;}
.cell{background:#12141c; border-radius:50%; aspect-ratio:1; cursor:pointer;}
.cell.y{background:#e2bc6b;} .cell.r{background:#e2725b;}
.msg{margin-top:14px; font-size:15px; color:#4ecca3; min-height:20px;}
.newbtn{margin-top:12px; background:#e2bc6b; color:#12141c; border:none; border-radius:10px; padding:9px 18px; font-weight:700; cursor:pointer;}
</style></head>
<body>
<h1>🔴 कनेक्ट फोर</h1>
<div class="sub">दोघे मिळून खेळा — सलग 4 सोडव (आडवे/उभे/तिरपे)</div>
<div class="turn">पाळी: <span id="turnLabel" class="y">पिवळा</span></div>
<div id="board"></div>
<div class="msg" id="msg"></div>
<button class="newbtn" id="newBtn">नवीन खेळ</button>
<script>
const COLS=7, ROWS=6;
let grid, current, over;
function init(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  current='y'; over=false;
  document.getElementById('msg').textContent='';
  document.getElementById('turnLabel').textContent='पिवळा'; document.getElementById('turnLabel').className='y';
  render();
}
function render(){
  const board=document.getElementById('board'); board.innerHTML='';
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cell=document.createElement('div');
    cell.className='cell'+(grid[r][c]?' '+grid[r][c]:'');
    cell.addEventListener('click', ()=>drop(c));
    board.appendChild(cell);
  }
}
function drop(c){
  if(over) return;
  for(let r=ROWS-1;r>=0;r--){
    if(!grid[r][c]){
      grid[r][c]=current; render();
      if(checkWin(r,c)){ over=true; document.getElementById('msg').textContent=`🎉 ${current==='y'?'पिवळा':'लाल'} जिंकला!`; return; }
      if(grid[0].every(v=>v)){ over=true; document.getElementById('msg').textContent='बरोबरी झाली!'; return; }
      current = current==='y'?'r':'y';
      document.getElementById('turnLabel').textContent = current==='y'?'पिवळा':'लाल';
      document.getElementById('turnLabel').className = current;
      return;
    }
  }
}
function checkWin(r,c){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  const color=grid[r][c];
  return dirs.some(([dr,dc])=>{
    let count=1;
    for(let s=1;s<4;s++){ const rr=r+dr*s, cc=c+dc*s; if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===color) count++; else break; }
    for(let s=1;s<4;s++){ const rr=r-dr*s, cc=c-dc*s; if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===color) count++; else break; }
    return count>=4;
  });
}
document.getElementById('newBtn').addEventListener('click', init);
init();
</script>
</body></html>
