<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nitro Rush — GameHub</title>
<style>
  :root{ --volt:#C6FF3D; --violet:#7A5CFF; --hot:#FF3D6E; --cyan:#3DD9FF; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{background:#0a0e14;overflow:hidden;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:linear-gradient(180deg,#101822,#0a0e14 85%);}

  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none;}
  .pill{background:rgba(20,20,31,0.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:6px 12px;font-size:12px;color:#F3F3F7;font-weight:600;display:flex;align-items:center;gap:6px;}
  .pill b{color:var(--volt);font-family:monospace;}
  .icon-btn{pointer-events:all;width:36px;height:36px;border-radius:50%;background:rgba(20,20,31,0.75);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;}

  .nitro-wrap{position:absolute;bottom:110px;left:0;right:0;padding:0 16px;z-index:5;pointer-events:none;}
  .nitro-bar{height:12px;border-radius:8px;background:rgba(255,255,255,0.08);overflow:hidden;border:1px solid rgba(255,255,255,0.14);}
  .nitro-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0%;transition:width .15s;}
  .nitro-label{font-size:10px;color:#9494A6;text-align:center;margin-top:4px;letter-spacing:1px;}

  .touch-zones{position:absolute;inset:0;bottom:0;display:flex;z-index:4;}
  .touch-zones div{flex:1;}
  .nitro-btn{position:absolute;bottom:24px;right:20px;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--violet));display:flex;align-items:center;justify-content:center;font-size:24px;z-index:6;box-shadow:0 4px 18px rgba(61,217,255,0.4);border:none;}
  .nitro-btn:active{transform:scale(0.92);}
  .nitro-btn:disabled{opacity:0.3;}

  .overlay{position:absolute;inset:0;background:rgba(5,5,10,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;}
  .hidden{display:none;}
  .title{font-size:30px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#9494A6;font-size:13px;margin-bottom:26px;max-width:280px;line-height:1.5;}
  .btn{padding:14px 30px;border-radius:9px;font-weight:800;font-size:15px;border:none;margin-bottom:12px;min-width:220px;}
  .btn-primary{background:var(--volt);color:#0A0A0F;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16);}
  .statrow{display:flex;gap:22px;margin-bottom:26px;}
  .stat{text-align:center;}
  .stat b{display:block;font-size:22px;font-family:monospace;color:var(--volt);}
  .stat span{font-size:11px;color:#9494A6;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="hud">
    <div style="display:flex;gap:8px;">
      <div class="pill">📏 <b id="distLabel">0</b>m</div>
      <div class="pill">💰 <b id="coinLabel">0</b></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="pauseBtn">⏸</button>
      <a class="icon-btn" href="../../game.html?id=nitro-rush">✕</a>
    </div>
  </div>

  <div class="nitro-wrap">
    <div class="nitro-bar"><div class="nitro-fill" id="nitroFill"></div></div>
    <div class="nitro-label">NITRO</div>
  </div>

  <div class="touch-zones" id="touchZones">
    <div id="zoneLeft"></div>
    <div id="zoneRight"></div>
  </div>
  <button class="nitro-btn" id="nitroBtn">🔥</button>

  <div class="overlay" id="startScreen">
    <div class="title">NITRO RUSH</div>
    <div class="sub">Tap left / right to switch lanes. Dodge traffic, collect coins to fill Nitro, then tap 🔥 for a speed burst.</div>
    <button class="btn btn-primary" id="startBtn">▶ Play Now</button>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <div class="title" style="font-size:24px;">PAUSED</div>
    <button class="btn btn-primary" id="resumeBtn">▶ Resume</button>
    <button class="btn btn-ghost" id="restartBtnPause">⟲ Restart</button>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="title" style="color:#FF3D6E;-webkit-text-fill-color:#FF3D6E;">CRASHED!</div>
    <div class="statrow">
      <div class="stat"><b id="finalDist">0</b><span>METERS</span></div>
      <div class="stat"><b id="finalCoins">0</b><span>COINS</span></div>
      <div class="stat"><b id="finalBest">0</b><span>BEST</span></div>
    </div>
    <button class="btn btn-primary" id="retryBtn">⟲ Race Again</button>
    <a class="btn btn-ghost" href="../../game.html?id=nitro-rush" style="text-decoration:none;display:block;text-align:center;">🎮 Back to GameHub</a>
  </div>
</div>

<script>
/* ============================================================
   NITRO RUSH — 4-lane arcade racer with nitro boost meter
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

let audioCtx=null;
function beep(freq,dur,type='square',vol=0.05){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

const LANES = 4;
let state='menu';
let lane=1, carX=0, carY=0;
let traffic=[], coins=[], particles=[];
let dist=0, baseSpeed=7, speed=7, spawnTimer=0, coinCount=0;
let nitro=0, nitroActive=0;
let best=parseInt(localStorage.getItem('nr_best')||'0');
let lastTick=0;

function laneX(i){ const w=canvas.width/LANES; return w*i + w/2; }

function resetGame(){
  lane=1; traffic=[]; coins=[]; particles=[];
  dist=0; speed=baseSpeed; spawnTimer=0; coinCount=0; nitro=0; nitroActive=0;
  carX = laneX(lane); carY = canvas.height*0.8;
  updateHUD();
}

function spawnRow(){
  const blockLane = Math.floor(Math.random()*LANES);
  for(let i=0;i<LANES;i++){
    if(i===blockLane && Math.random()<0.75){
      traffic.push({ lane:i, y:-50 });
    } else if(Math.random()<0.3){
      coins.push({ lane:i, y:-50 });
    }
  }
}

function update(dt){
  if(state!=='playing') return;
  if(nitroActive>0){ nitroActive-=dt; speed = baseSpeed*2.1; }
  else { speed = Math.min(20, baseSpeed + dist/260); }

  dist += speed*dt*3;
  const targetX = laneX(lane);
  carX += (targetX-carX)*0.28;

  spawnTimer -= dt;
  if(spawnTimer<=0){ spawnRow(); spawnTimer = Math.max(0.4, 1.0 - dist/1000); }

  traffic.forEach(t => t.y += speed*60*dt);
  coins.forEach(c => c.y += speed*60*dt);

  traffic.forEach(t => {
    if(!t.dead && t.lane===lane && Math.abs(t.y-carY) < 34){ crash(); }
  });
  coins.forEach(c => {
    if(!c.dead && c.lane===lane && Math.abs(c.y-carY) < 30){
      c.dead=true; coinCount++; nitro = Math.min(100, nitro+12);
      beep(700,0.06,'triangle',0.03);
    }
  });

  traffic = traffic.filter(t=>!t.dead && t.y<canvas.height+60);
  coins = coins.filter(c=>!c.dead && c.y<canvas.height+60);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});
  particles = particles.filter(p=>p.life>0);

  updateHUD();
}

function activateNitro(){
  if(nitro>=100 && nitroActive<=0){
    nitroActive = 1.8; nitro=0; beep(200,0.3,'sawtooth',0.07);
  }
}

function updateHUD(){
  document.getElementById('distLabel').textContent = Math.floor(dist);
  document.getElementById('coinLabel').textContent = coinCount;
  document.getElementById('nitroFill').style.width = nitro+'%';
  document.getElementById('nitroBtn').disabled = nitro<100;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const w = canvas.width/LANES;
  ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.setLineDash([16,14]);
  for(let i=1;i<LANES;i++){ ctx.beginPath(); ctx.moveTo(w*i,0); ctx.lineTo(w*i,canvas.height); ctx.stroke(); }
  ctx.setLineDash([]);

  coins.forEach(c => {
    ctx.fillStyle='#FFD65C'; ctx.shadowColor='#FFD65C'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(laneX(c.lane), c.y, 8, 0, 7); ctx.fill(); ctx.shadowBlur=0;
  });
  traffic.forEach(t => {
    ctx.fillStyle='#FF3D6E'; ctx.shadowColor='#FF3D6E'; ctx.shadowBlur=10;
    const x=laneX(t.lane);
    ctx.fillRect(x-16, t.y-24, 32, 48);
    ctx.shadowBlur=0;
  });
  particles.forEach(p => { ctx.globalAlpha=p.life/20; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); ctx.globalAlpha=1; });

  if(state==='playing' || state==='paused'){
    ctx.fillStyle = nitroActive>0 ? '#3DD9FF' : '#F3F3F7';
    ctx.shadowColor = nitroActive>0 ? '#3DD9FF' : '#7A5CFF'; ctx.shadowBlur=16;
    ctx.fillRect(carX-15, carY-26, 30, 52);
    ctx.shadowBlur=0;
  }
}

function loop(ts){
  if(!lastTick) lastTick=ts;
  const dt=Math.min(0.05,(ts-lastTick)/1000);
  lastTick=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function moveLeft(){ if(lane>0) lane--; }
function moveRight(){ if(lane<LANES-1) lane++; }

document.getElementById('zoneLeft').addEventListener('touchstart', e=>{e.preventDefault(); moveLeft();}, {passive:false});
document.getElementById('zoneRight').addEventListener('touchstart', e=>{e.preventDefault(); moveRight();}, {passive:false});
document.getElementById('zoneLeft').addEventListener('mousedown', moveLeft);
document.getElementById('zoneRight').addEventListener('mousedown', moveRight);
document.getElementById('nitroBtn').addEventListener('click', activateNitro);
addEventListener('keydown', e => {
  if(e.key==='ArrowLeft') moveLeft();
  if(e.key==='ArrowRight') moveRight();
  if(e.key===' ') activateNitro();
});

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

document.getElementById('startBtn').onclick = () => { resetGame(); hide('startScreen'); state='playing'; };
document.getElementById('pauseBtn').onclick = () => { if(state==='playing'){ state='paused'; show('pauseScreen'); } };
document.getElementById('resumeBtn').onclick = () => { hide('pauseScreen'); state='playing'; };
document.getElementById('restartBtnPause').onclick = () => { hide('pauseScreen'); resetGame(); state='playing'; };
document.getElementById('retryBtn').onclick = () => { hide('overScreen'); resetGame(); state='playing'; };

function crash(){
  if(state!=='playing') return;
  state='over'; beep(110,0.4,'sawtooth',0.08);
  const finalDist = Math.floor(dist);
  if(finalDist>best){ best=finalDist; localStorage.setItem('nr_best', best); }
  document.getElementById('finalDist').textContent = finalDist;
  document.getElementById('finalCoins').textContent = coinCount;
  document.getElementById('finalBest').textContent = best;
  show('overScreen');
}
</script>
</body>
</html>
