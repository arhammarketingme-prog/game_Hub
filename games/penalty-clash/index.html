<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Penalty Clash — GameHub</title>
<style>
  :root{ --volt:#C6FF3D; --violet:#7A5CFF; --hot:#FF3D6E; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{background:#0a140a;overflow:hidden;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:linear-gradient(180deg,#12241a,#0a140a 85%);}
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none;}
  .pill{background:rgba(20,20,31,0.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:6px 12px;font-size:12px;color:#F3F3F7;font-weight:600;display:flex;align-items:center;gap:6px;}
  .pill b{color:var(--volt);font-family:monospace;}
  .icon-btn{pointer-events:all;width:36px;height:36px;border-radius:50%;background:rgba(20,20,31,0.75);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .result-toast{position:absolute;top:90px;left:50%;transform:translate(-50%,0);padding:8px 20px;border-radius:20px;font-weight:900;font-size:15px;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;}
  .result-toast.goal{background:rgba(198,255,61,0.92);color:#0A0A0F;}
  .result-toast.saved{background:rgba(255,61,110,0.92);color:#fff;}
  .result-toast.show{opacity:1;}
  .overlay{position:absolute;inset:0;background:rgba(4,10,4,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;}
  .hidden{display:none;}
  .title{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;background:linear-gradient(90deg,var(--volt),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#9494A6;font-size:13px;margin-bottom:24px;max-width:280px;line-height:1.5;}
  .btn{padding:14px 30px;border-radius:9px;font-weight:800;font-size:15px;border:none;margin-bottom:12px;min-width:220px;}
  .btn-primary{background:var(--volt);color:#0A0A0F;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16);}
  .statrow{display:flex;gap:22px;margin-bottom:26px;}
  .stat{text-align:center;}
  .stat b{display:block;font-size:22px;font-family:monospace;color:var(--volt);}
  .stat span{font-size:11px;color:#9494A6;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="pill">⚽ Round <b id="roundLabel">1</b>/<b id="roundTotal">5</b></div>
    <div style="display:flex;gap:8px;">
      <div class="pill">🥅 <b id="scoreLabel">0</b></div>
      <a class="icon-btn" href="../../game.html?id=penalty-clash">✕</a>
    </div>
  </div>
  <div class="result-toast" id="resultToast"></div>

  <div class="overlay" id="startScreen">
    <div class="title">PENALTY CLASH</div>
    <div class="sub">Drag on the ball to aim, then release to shoot. Aim for the corners — the keeper dives late and often guesses wrong!</div>
    <button class="btn btn-primary" id="startBtn">▶ Play Now</button>
  </div>
  <div class="overlay hidden" id="pauseScreen">
    <div class="title" style="font-size:22px;">PAUSED</div>
    <button class="btn btn-primary" id="resumeBtn">▶ Resume</button>
    <button class="btn btn-ghost" id="restartBtnPause">⟲ Restart</button>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="title" id="overTitle">MATCH COMPLETE</div>
    <div class="statrow">
      <div class="stat"><b id="finalScore">0</b><span>GOALS</span></div>
      <div class="stat"><b id="finalTotal">5</b><span>ROUNDS</span></div>
      <div class="stat"><b id="finalBest">0</b><span>BEST</span></div>
    </div>
    <button class="btn btn-primary" id="retryBtn">⟲ Play Again</button>
    <a class="btn btn-ghost" href="../../game.html?id=penalty-clash" style="text-decoration:none;display:block;text-align:center;">🎮 Back to GameHub</a>
  </div>
</div>

<script>
/* ============================================================
   PENALTY CLASH — drag-to-shoot penalty shootout
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let SCALE = 1;
function resize(){
  canvas.width = innerWidth; canvas.height = innerHeight;
  SCALE = Math.min(2.1, Math.max(0.85, Math.min(canvas.width, canvas.height) / 420));
}
resize(); addEventListener('resize', resize);

let audioCtx=null;
function beep(freq,dur,type='square',vol=0.05){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

let state='menu';
let ball={x:0,y:0,r:14,vx:0,vy:0,moving:false};
let ballStart={x:0,y:0};
let goal={x:0,y:0,w:200,h:110};
let keeper={x:0,y:0,r:20,targetX:0};
let round=1, roundTotal=5, score=0, best=parseInt(localStorage.getItem('pk_best')||'0');
let dragging=false, dragStart=null, dragCur=null;
let resolving=false;
let lastTick=0;
const GRAVITY=900;

function resetRound(){
  goal = { x: canvas.width/2 - 100*SCALE, y: canvas.height*0.18, w:200*SCALE, h:110*SCALE };
  ballStart = { x: canvas.width/2, y: canvas.height*0.8 };
  ball = { x:ballStart.x, y:ballStart.y, r:14*SCALE, vx:0, vy:0, moving:false };
  keeper = { x: canvas.width/2, y: goal.y+goal.h*0.5, r:22*SCALE, targetX: canvas.width/2 };
  resolving=false;
}
function resetGame(){
  round=1; score=0; resetRound();
  document.getElementById('roundLabel').textContent = round;
  document.getElementById('roundTotal').textContent = roundTotal;
  updateHUD();
}

function updateHUD(){
  document.getElementById('roundLabel').textContent = round;
  document.getElementById('scoreLabel').textContent = score;
}

function update(dt){
  if(state!=='playing') return;
  if(ball.moving){
    ball.vy += GRAVITY*dt;
    ball.x += ball.vx*dt;
    ball.y += ball.vy*dt;

    if(!resolving && ball.y < goal.y+goal.h+20){
      resolving = true;
      keeper.targetX = ball.x + (Math.random()-0.5)*60;
    }
    if(resolving){
      keeper.x += (keeper.targetX-keeper.x)*0.18;
    }

    const inGoalPlane = ball.y <= goal.y+goal.h && ball.y >= goal.y-10;
    if(inGoalPlane){
      const savedByKeeper = Math.hypot(ball.x-keeper.x, ball.y-keeper.y) < keeper.r+ball.r+6;
      const inGoalX = ball.x > goal.x && ball.x < goal.x+goal.w;
      if(savedByKeeper){
        endRound(false); return;
      } else if(inGoalX && ball.y < goal.y+goal.h){
        endRound(true); return;
      }
    }
    if(ball.y < -40 || ball.y>canvas.height+60 || ball.x<-60 || ball.x>canvas.width+60){
      endRound(false);
    }
  }
}

function endRound(scored){
  ball.moving=false;
  if(scored){ score++; toast('GOAL!','goal'); beep(700,0.15,'triangle'); }
  else { toast('SAVED!','saved'); beep(160,0.2,'sawtooth'); }
  updateHUD();
  setTimeout(()=>{
    round++;
    if(round>roundTotal){ finishMatch(); }
    else { document.getElementById('roundLabel').textContent = round; resetRound(); }
  }, 900);
}

function toast(msg, cls){
  const t=document.getElementById('resultToast');
  t.textContent=msg; t.className = 'result-toast show '+cls;
  setTimeout(()=>t.classList.remove('show'), 800);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle='#fff'; ctx.lineWidth=4;
  ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);
  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(255,255,255,0.4)';
  for(let i=1;i<5;i++){ ctx.beginPath(); ctx.moveTo(goal.x+goal.w/5*i, goal.y); ctx.lineTo(goal.x+goal.w/5*i, goal.y+goal.h); ctx.stroke(); }

  ctx.fillStyle='#3DD9FF'; ctx.shadowColor='#3DD9FF'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(keeper.x, keeper.y, keeper.r, 0, 7); ctx.fill();
  ctx.shadowBlur=0;

  if(dragging && dragStart && dragCur){
    const dx = dragStart.x-dragCur.x, dy = dragStart.y-dragCur.y;
    ctx.strokeStyle='rgba(198,255,61,0.5)'; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x+dx*1.6, ball.y+dy*1.6); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle='#fff'; ctx.shadowColor='#000'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill();
  ctx.shadowBlur=0;
}

function loop(ts){
  if(!lastTick) lastTick=ts;
  const dt=Math.min(0.05,(ts-lastTick)/1000);
  lastTick=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x:t.clientX-rect.left, y:t.clientY-rect.top };
}
function onDown(e){
  if(state!=='playing' || ball.moving) return;
  const p=getPos(e);
  if(Math.hypot(p.x-ball.x,p.y-ball.y) < 60){ dragging=true; dragStart=p; dragCur=p; }
}
function onMove(e){ if(dragging) dragCur=getPos(e); }
function onUp(){
  if(!dragging) return;
  dragging=false;
  const dx=dragStart.x-dragCur.x, dy=dragStart.y-dragCur.y;
  const power = Math.hypot(dx,dy);
  if(power>10){
    ball.vx = dx*3.4; ball.vy = dy*3.4;
    ball.moving = true;
    beep(400,0.08,'square',0.03);
  }
}
canvas.addEventListener('touchstart', e=>{e.preventDefault(); onDown(e);}, {passive:false});
canvas.addEventListener('touchmove', e=>{e.preventDefault(); onMove(e);}, {passive:false});
canvas.addEventListener('touchend', e=>{e.preventDefault(); onUp();}, {passive:false});
canvas.addEventListener('mousedown', onDown);
addEventListener('mousemove', onMove);
addEventListener('mouseup', onUp);

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

document.getElementById('startBtn').onclick = () => { hide('startScreen'); resetGame(); state='playing'; };
document.getElementById('resumeBtn').onclick = () => { hide('pauseScreen'); state='playing'; };
document.getElementById('restartBtnPause').onclick = () => { hide('pauseScreen'); resetGame(); state='playing'; };
document.getElementById('retryBtn').onclick = () => { hide('overScreen'); resetGame(); state='playing'; };

function finishMatch(){
  state='over';
  if(score>best){ best=score; localStorage.setItem('pk_best', best); }
  document.getElementById('overTitle').textContent = score>=roundTotal*0.6 ? 'GREAT SHOOTOUT!' : 'MATCH COMPLETE';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalTotal').textContent = roundTotal;
  document.getElementById('finalBest').textContent = best;
  show('overScreen');
}
</script>
</body>
</html>
