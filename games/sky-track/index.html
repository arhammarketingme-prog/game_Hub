<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sky Track — GameHub</title>
<style>
  :root{ --volt:#C6FF3D; --violet:#7A5CFF; --hot:#FF3D6E; --cyan:#3DD9FF; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{background:#050a14;overflow:hidden;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:linear-gradient(180deg,#0a1428,#050a14 85%);}
  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none;}
  .pill{background:rgba(20,20,31,0.75);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:6px 12px;font-size:12px;color:#F3F3F7;font-weight:600;display:flex;align-items:center;gap:6px;}
  .pill b{color:var(--cyan);font-family:monospace;}
  .icon-btn{pointer-events:all;width:36px;height:36px;border-radius:50%;background:rgba(20,20,31,0.75);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .touch-zones{position:absolute;inset:0;bottom:0;display:flex;z-index:4;}
  .touch-zones div{flex:1;}
  .overlay{position:absolute;inset:0;background:rgba(3,6,12,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;}
  .hidden{display:none;}
  .title{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#9494A6;font-size:13px;margin-bottom:24px;max-width:280px;line-height:1.5;}
  .btn{padding:14px 30px;border-radius:9px;font-weight:800;font-size:15px;border:none;margin-bottom:12px;min-width:220px;}
  .btn-primary{background:var(--volt);color:#0A0A0F;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16);}
  .statrow{display:flex;gap:22px;margin-bottom:26px;}
  .stat{text-align:center;}
  .stat b{display:block;font-size:22px;font-family:monospace;color:var(--cyan);}
  .stat span{font-size:11px;color:#9494A6;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="pill">📏 <b id="distLabel">0</b>m</div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="pauseBtn">⏸</button>
      <a class="icon-btn" href="../../game.html?id=sky-track">✕</a>
    </div>
  </div>
  <div class="touch-zones" id="touchZones"><div id="zoneLeft"></div><div id="zoneRight"></div></div>

  <div class="overlay" id="startScreen">
    <div class="title">SKY TRACK</div>
    <div class="sub">Tap left/right to shift between floating lanes. Gaps in the track mean instant fall — time your switches carefully as speed ramps up.</div>
    <button class="btn btn-primary" id="startBtn">▶ Play Now</button>
  </div>
  <div class="overlay hidden" id="pauseScreen">
    <div class="title" style="font-size:24px;">PAUSED</div>
    <button class="btn btn-primary" id="resumeBtn">▶ Resume</button>
    <button class="btn btn-ghost" id="restartBtnPause">⟲ Restart</button>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="title" style="color:#FF3D6E;-webkit-text-fill-color:#FF3D6E;">FELL OFF TRACK</div>
    <div class="statrow">
      <div class="stat"><b id="finalDist">0</b><span>METERS</span></div>
      <div class="stat"><b id="finalBest">0</b><span>BEST</span></div>
    </div>
    <button class="btn btn-primary" id="retryBtn">⟲ Fly Again</button>
    <a class="btn btn-ghost" href="../../game.html?id=sky-track" style="text-decoration:none;display:block;text-align:center;">🎮 Back to GameHub</a>
  </div>
</div>

<script>
/* ============================================================
   SKY TRACK — futuristic floating-lane racer with gaps
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let SCALE = 1;
function resize(){
  canvas.width = innerWidth; canvas.height = innerHeight;
  SCALE = Math.min(2.1, Math.max(0.85, Math.min(canvas.width, canvas.height) / 420));
}
resize(); addEventListener('resize', resize);

let audioCtx=null;
function beep(freq,dur,type='square',vol=0.05){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

const LANES = 3;
let state='menu';
let lane=1, shipX=0, shipY=0, shipZ=0;
let segments=[], particles=[];
let dist=0, speed=6, spawnTimer=0;
let best = parseInt(localStorage.getItem('skt_best')||'0');
let lastTick=0;
const SEG_H = 60;

function laneX(i){ const w=canvas.width/LANES; return w*i+w/2; }

function resetGame(){
  lane=1; segments=[]; particles=[]; dist=0; speed=6; spawnTimer=0; shipZ=0;
  shipX=laneX(lane); shipY=canvas.height*0.78;
  for(let y=canvas.height; y>-200; y-=SEG_H){
    segments.push(makeSegmentRow(y));
  }
}

function makeSegmentRow(y){
  const gapLane = Math.random()<0.22 ? Math.floor(Math.random()*LANES) : -1;
  return { y, gapLane };
}

function update(dt){
  if(state!=='playing') return;
  speed = Math.min(19, 6+dist/260);
  dist += speed*dt*3;

  const targetX = laneX(lane);
  shipX += (targetX-shipX)*0.25;

  segments.forEach(s=>s.y += speed*60*dt);
  while(segments.length && segments[segments.length-1].y > canvas.height+SEG_H){
    segments.pop();
  }
  while(segments[0].y > -SEG_H){
    segments.unshift(makeSegmentRow(segments[0].y - SEG_H));
  }

  // check if ship is over a gap
  const row = segments.find(s => Math.abs(s.y-shipY) < SEG_H/2);
  if(row && row.gapLane === lane){ crash(); }

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});
  particles = particles.filter(p=>p.life>0);
  if(state==='playing'){
    particles.push({x:shipX+(Math.random()-0.5)*10*SCALE, y:shipY+20*SCALE, vx:0, vy:3, life:12, color:'#3DD9FF'});
  }

  updateHUD();
}

function updateHUD(){ document.getElementById('distLabel').textContent = Math.floor(dist); }

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const w = canvas.width/LANES;

  segments.forEach(s => {
    for(let i=0;i<LANES;i++){
      if(i===s.gapLane) continue;
      ctx.fillStyle = 'rgba(61,217,255,0.12)';
      ctx.fillRect(w*i+3, s.y-SEG_H/2+2, w-6, SEG_H-6);
      ctx.strokeStyle = 'rgba(61,217,255,0.3)';
      ctx.strokeRect(w*i+3, s.y-SEG_H/2+2, w-6, SEG_H-6);
    }
  });

  particles.forEach(p => { ctx.globalAlpha=p.life/12; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.5*SCALE,0,7); ctx.fill(); ctx.globalAlpha=1; });

  if(state==='playing' || state==='paused'){
    ctx.save();
    ctx.translate(shipX, shipY);
    ctx.fillStyle='#F3F3F7'; ctx.shadowColor='#3DD9FF'; ctx.shadowBlur=16;
    ctx.beginPath();
    ctx.moveTo(0,-20*SCALE);
    ctx.lineTo(14*SCALE,16*SCALE);
    ctx.lineTo(0,8*SCALE);
    ctx.lineTo(-14*SCALE,16*SCALE);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }
}

function loop(ts){
  if(!lastTick) lastTick=ts;
  const dt=Math.min(0.05,(ts-lastTick)/1000);
  lastTick=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function moveLeft(){ if(lane>0) lane--; }
function moveRight(){ if(lane<LANES-1) lane++; }
document.getElementById('zoneLeft').addEventListener('touchstart', e=>{e.preventDefault(); moveLeft();}, {passive:false});
document.getElementById('zoneRight').addEventListener('touchstart', e=>{e.preventDefault(); moveRight();}, {passive:false});
document.getElementById('zoneLeft').addEventListener('mousedown', moveLeft);
document.getElementById('zoneRight').addEventListener('mousedown', moveRight);
addEventListener('keydown', e=>{ if(e.key==='ArrowLeft') moveLeft(); if(e.key==='ArrowRight') moveRight(); });

function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

document.getElementById('startBtn').onclick = () => { resetGame(); hide('startScreen'); state='playing'; };
document.getElementById('pauseBtn').onclick = () => { if(state==='playing'){ state='paused'; show('pauseScreen'); } };
document.getElementById('resumeBtn').onclick = () => { hide('pauseScreen'); state='playing'; };
document.getElementById('restartBtnPause').onclick = () => { hide('pauseScreen'); resetGame(); state='playing'; };
document.getElementById('retryBtn').onclick = () => { hide('overScreen'); resetGame(); state='playing'; };

function crash(){
  if(state!=='playing') return;
  state='over'; beep(110,0.4,'sawtooth',0.08);
  const finalDist = Math.floor(dist);
  if(finalDist>best){ best=finalDist; localStorage.setItem('skt_best', best); }
  document.getElementById('finalDist').textContent = finalDist;
  document.getElementById('finalBest').textContent = best;
  show('overScreen');
}
</script>
</body>
</html>
